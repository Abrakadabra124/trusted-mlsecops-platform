name: Replace an owned serving cluster
description: Recheck the source SQL and both live cluster identities across deletion and bootstrap
inputs:
  phase:
    description: Completed gate
    required: true
  source_sql:
    description: Owner hash of the source SQL marker
    required: true
  retention:
    description: Original storage-recovery retention hash, mandatory for the M15 to M11-M12 handoff
    required: false
    default: ''
outputs:
  transition:
    description: Observed public identity hashes on either side of the transition
    value: ${{ steps.rotate.outputs.transition }}
runs:
  using: composite
  steps:
    - id: rotate
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        SOURCE_SQL: ${{ inputs.source_sql }}
        SERVING_RETENTION: ${{ inputs.retention }}
      run: |
        uv run --locked python - <<'PY'
        import os
        from pathlib import Path
        from mlsecops.contracts import canonical
        from scripts.kube_trust_native import hosted
        from scripts.serving_campaign import transition
        from scripts.serving_retention import load, preflight
        hosted()
        phase = os.environ["PHASE"]
        successors = {"M13": "M14", "M14": "M15", "M15": "M11-M12"}
        retention = os.environ["SERVING_RETENTION"]
        if phase not in successors or (phase == "M15" and not retention):
            raise SystemExit("unknown serving phase")
        root, state = Path.cwd(), Path(".runtime").resolve()
        if retention:
            receipt, _ = load(root, state, retention, os.environ["GITHUB_SHA"])
            if receipt["source_sql"] != os.environ["SOURCE_SQL"]:
                raise SystemExit("serving source owner mismatch")
            preflight(root, state, retention, os.environ["GITHUB_SHA"], successors[phase])
        packet = transition(state, Path(os.environ["RUNNER_TEMP"]) / (phase+"-retired"), os.environ["SOURCE_SQL"])
        if retention:
            preflight(root, state, retention, os.environ["GITHUB_SHA"], successors[phase])
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            print("transition="+canonical(packet).decode(), file=out)
        PY
