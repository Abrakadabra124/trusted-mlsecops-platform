name: Storage role and TLS qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked dependencies and source checks
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked pip-audit --strict --progress-spinner off
      - name: Fresh PostgreSQL bootstrap and actual role operations
        run: |
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python -m mlsecops.storage_bootstrap
          uv run --locked python -m mlsecops.storage_qualification
      - name: Actual training and evaluation through scoped SQL identities
        run: |
          uv run --locked python -m mlsecops build
          uv run --locked python -m mlsecops.storage_pipeline_qualification
      - name: Sanitized storage evidence
        if: always()
        run: |
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/storage-qualification.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed storage qualification evidence')"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/storage-pipeline-qualification.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed storage pipeline evidence')"
          echo 'Role-restricted SQL pipeline components. Independent controllers and full M03/M04/M20 remain pending.' >> "$GITHUB_STEP_SUMMARY"
