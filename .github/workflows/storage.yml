name: Storage role and TLS qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked dependencies and source checks
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked pip-audit --strict --progress-spinner off
          uv run --locked coverage run --source=mlsecops.holdout_budget -m scripts.holdout_budget_qualification
          uv run --locked coverage report --fail-under=95
          uv run --locked coverage run --data-file=.coverage-evaluation --source=mlsecops.evaluation_quality -m unittest scripts.evaluation_quality_qualification scripts.evaluation_binding_qualification
          uv run --locked coverage report --data-file=.coverage-evaluation --fail-under=95
          uv run --locked coverage run --data-file=.coverage-m07 --source=mlsecops.evaluation_gate -m unittest scripts.evaluation_gate_qualification
          uv run --locked coverage report --data-file=.coverage-m07 --fail-under=95
      - name: Holdout claim diagnostics and redaction contracts
        run: |
          uv run --locked coverage run --data-file=.coverage-holdout-diagnostics --source=mlsecops.holdout_diagnostics -m unittest scripts.holdout_budget_qualification.BudgetDiagnosticContracts
          uv run --locked coverage report --data-file=.coverage-holdout-diagnostics --fail-under=100
      - name: Signed intake denial and outage contracts
        run: |
          uv run --locked coverage run --source=mlsecops.intake_denial --data-file=.coverage-intake-denial -m scripts.intake_denial_qualification
          uv run --locked coverage report --data-file=.coverage-intake-denial --fail-under=95
      - name: Candidate lineage contracts and diagnostic runner
        run: |
          uv run --locked coverage run --source=mlsecops.candidate_lineage --data-file=.coverage-candidate-lineage -m scripts.candidate_lineage_qualification
          uv run --locked coverage report --data-file=.coverage-candidate-lineage --fail-under=100
          uv run --locked coverage run --source=scripts.candidate_lineage_native --data-file=.coverage-lineage-native -m scripts.candidate_lineage_native_qualification
          uv run --locked coverage report --data-file=.coverage-lineage-native --fail-under=100
      - name: Fresh PostgreSQL service
        run: |
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python -m mlsecops.storage_bootstrap
      - name: Candidate material bundle contracts and diagnostic runner
        run: |
          uv run --locked coverage run --source=mlsecops.material_bundle --data-file=.coverage-material-bundle -m scripts.material_bundle_qualification
          uv run --locked coverage report --data-file=.coverage-material-bundle --fail-under=100
          uv run --locked coverage run --source=scripts.material_bundle_native --data-file=.coverage-bundle-native -m scripts.material_bundle_native_qualification
          uv run --locked coverage report --data-file=.coverage-bundle-native --fail-under=100
      - name: M03 integrity, actual SQL roles and training/evaluation
        run: |
          uv run --locked python -m mlsecops build
          uv run --locked python -m mlsecops.acceptance --gate M03 --output .runtime/evidence/M03.json
      - name: Read-only lineage from actual signed SQL materials
        run: uv run --locked python -m scripts.candidate_lineage_native --state .runtime
      - name: Unapproved material bundle and serving-role verified readback
        run: uv run --locked python -m scripts.material_bundle_native --state .runtime
      - name: Consistent backup and independent storage recovery
        run: uv run --locked python -m mlsecops.storage_recovery_qualification
      - name: M07 fresh evaluation, signed readback, leakage contracts and durable budget
        run: uv run --locked python -m mlsecops.acceptance --gate M07 --output .runtime/evidence/M07.json
      - name: Sanitized storage evidence
        if: always()
        run: |
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/M03.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed M03 evidence')"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/storage-recovery-qualification.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed storage recovery evidence')"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/M07.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed M07 evidence')"
          echo 'M03 and synthetic M07 plus storage recovery. Controllers are checked separately; full M17 and full R1 remain pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Durable intake denials in disposable SQL state
        run: uv run --locked python -m scripts.intake_denial_native --state .runtime --confirm-disposable
      - name: Sanitized denial evidence
        if: always()
        run: |
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/intake-denial-qualification.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed denial qualification evidence')"
