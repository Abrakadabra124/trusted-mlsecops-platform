name: Storage role and TLS qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked dependencies and source checks
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked pip-audit --strict --progress-spinner off
          uv run --locked coverage run --source=mlsecops.holdout_budget -m scripts.holdout_budget_qualification
          uv run --locked coverage report --fail-under=95
          uv run --locked coverage run --data-file=.coverage-evaluation --source=mlsecops.evaluation_quality -m unittest scripts.evaluation_quality_qualification scripts.evaluation_binding_qualification
          uv run --locked coverage report --data-file=.coverage-evaluation --fail-under=95
          uv run --locked coverage run --data-file=.coverage-m07 --source=mlsecops.evaluation_gate -m unittest scripts.evaluation_gate_qualification
          uv run --locked coverage report --data-file=.coverage-m07 --fail-under=95
      - name: Private audit and retained storage lifecycle contracts
        run: |
          uv run --locked coverage run --data-file=.coverage-audit-branch-checker --source=scripts.audit_branch_coverage -m unittest scripts.audit_branch_coverage_qualification
          uv run --locked coverage report --data-file=.coverage-audit-branch-checker --fail-under=100
          uv run --locked coverage run --data-file=.coverage-serving-audit --source=mlsecops.serving_audit,mlsecops.audit_retention,mlsecops.audit_event -m unittest scripts.serving_audit_qualification scripts.audit_retention_qualification scripts.audit_admission_qualification scripts.audit_event_qualification
          uv run --locked coverage report --data-file=.coverage-serving-audit --include='mlsecops/audit_event.py' --fail-under=100
          uv run --locked coverage report --data-file=.coverage-serving-audit --include='mlsecops/serving_audit.py' --fail-under=95
          uv run --locked coverage report --data-file=.coverage-serving-audit --include='mlsecops/audit_retention.py' --fail-under=90
          uv run --locked python -m scripts.audit_branch_coverage .coverage-serving-audit
      - name: Holdout claim diagnostics and redaction contracts
        run: |
          uv run --locked coverage run --data-file=.coverage-holdout-diagnostics --source=mlsecops.holdout_diagnostics -m unittest scripts.holdout_budget_qualification.BudgetDiagnosticContracts
          uv run --locked coverage report --data-file=.coverage-holdout-diagnostics --fail-under=100
      - name: Signed intake denial and outage contracts
        run: |
          uv run --locked coverage run --source=mlsecops.intake_denial --data-file=.coverage-intake-denial -m scripts.intake_denial_qualification
          uv run --locked coverage report --data-file=.coverage-intake-denial --fail-under=95
      - name: Candidate lineage contracts and diagnostic runner
        run: |
          uv run --locked coverage run --source=mlsecops.candidate_lineage --data-file=.coverage-candidate-lineage -m scripts.candidate_lineage_qualification
          uv run --locked coverage report --data-file=.coverage-candidate-lineage --fail-under=100
          uv run --locked coverage run --source=scripts.candidate_lineage_native --data-file=.coverage-lineage-native -m scripts.candidate_lineage_native_qualification
          uv run --locked coverage report --data-file=.coverage-lineage-native --fail-under=100
      - name: Fresh PostgreSQL service
        run: |
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python -m mlsecops.storage_bootstrap
      - name: Release bundle, authority separation and fail-closed report contracts
        run: |
          uv run --locked coverage run --data-file=.coverage-release --source=mlsecops.release_policy,mlsecops.release_bundle,mlsecops.release_authorization -m unittest scripts.release_policy_qualification scripts.release_bundle_qualification scripts.release_authorization_qualification
          uv run --locked coverage report --data-file=.coverage-release --fail-under=100
          uv run --locked coverage run --data-file=.coverage-release-native --source=scripts.release_native -m scripts.release_native_qualification
          uv run --locked coverage report --data-file=.coverage-release-native --fail-under=95
      - name: Candidate material bundle contracts and diagnostic runner
        run: |
          uv run --locked coverage run --source=mlsecops.material_bundle --data-file=.coverage-material-bundle -m scripts.material_bundle_qualification
          uv run --locked coverage report --data-file=.coverage-material-bundle --fail-under=100
          uv run --locked coverage run --source=scripts.material_bundle_native --data-file=.coverage-bundle-native -m scripts.material_bundle_native_qualification
          uv run --locked coverage report --data-file=.coverage-bundle-native --fail-under=100
      - name: Promotion admission and ledger request contracts
        run: |
          uv run --locked coverage run --data-file=.coverage-promotion --source=mlsecops.promotion,mlsecops.promotion_state -m unittest scripts.promotion_qualification scripts.promotion_state_qualification
          uv run --locked coverage report --data-file=.coverage-promotion --fail-under=100
          uv run --locked python -m scripts.promotion_native_qualification
      - name: M03 integrity, actual SQL roles and training/evaluation
        run: |
          uv run --locked python -m mlsecops build
          uv run --locked python -m mlsecops.acceptance --gate M03 --output .runtime/evidence/M03.json
      - name: Promotion recovery contracts and CLI boundaries
        run: |
          uv run --locked coverage run --data-file=.coverage-promotion-recovery --source=mlsecops.promotion_recovery -m scripts.promotion_recovery_qualification
          uv run --locked coverage report --data-file=.coverage-promotion-recovery --fail-under=100
          uv run --locked python -m scripts.promotion_recovery_native_qualification
          uv run --locked coverage run --data-file=.coverage-recovery-lock --source=mlsecops.recovery_lock -m scripts.recovery_lock_qualification
          uv run --locked coverage report --data-file=.coverage-recovery-lock --fail-under=100
      - name: Read-only lineage from actual signed SQL materials
        run: uv run --locked python -m scripts.candidate_lineage_native --state .runtime
      - name: Unapproved material bundle and serving-role verified readback
        run: uv run --locked python -m scripts.material_bundle_native --state .runtime
      - name: Signed release proposal, SQL readback and missing assurance denial
        run: uv run --locked python -m scripts.release_native --state .runtime
      - name: Consistent backup and independent storage recovery
        run: uv run --locked python -m mlsecops.storage_recovery_qualification
      - name: M07 fresh evaluation, signed readback, leakage contracts and durable budget
        run: uv run --locked python -m mlsecops.acceptance --gate M07 --output .runtime/evidence/M07.json
      - name: Sanitized storage evidence
        if: always()
        run: |
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/M03.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed M03 evidence')"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/storage-recovery-qualification.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed storage recovery evidence')"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/M07.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed M07 evidence')"
          echo 'M03 and synthetic M07 plus storage recovery. Controllers are checked separately; full M17 and full R1 remain pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Durable intake denials in disposable SQL state
        run: uv run --locked python -m scripts.intake_denial_native --state .runtime --confirm-disposable
      - name: Sanitized denial evidence
        if: always()
        run: |
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/intake-denial-qualification.json'); print(canonical(read_json(report)).decode() if report.exists() else 'No completed denial qualification evidence')"
      - name: Disposable promotion ledger SQL concurrency, roles and restart
        run: uv run --locked python -m scripts.promotion_native --state .runtime --confirm-disposable
      - name: Complete journal backup and independent recovery with source offline
        run: uv run --locked python -m scripts.promotion_recovery_native --state .runtime --confirm-disposable
      - name: Current trust, lease and authority command contracts
        run: |
          uv run --locked coverage run --data-file=.coverage-trust --source=mlsecops.trust,mlsecops.trust_authority -m unittest scripts.trust_qualification scripts.trust_authority_qualification
          uv run --locked coverage report --data-file=.coverage-trust --fail-under=100
          uv run --locked python -m scripts.trust_native_qualification
      - name: Separate TLS trust authority, revocations and real sixty-second outage
        run: uv run --locked python -m scripts.trust_native --state .runtime --confirm-disposable
      - name: Current release reader and immutable handoff contracts
        run: |
          uv run --locked coverage run --data-file=.coverage-release-reader --source=mlsecops.release_reader -m unittest scripts.release_reader_qualification
          uv run --locked coverage report --data-file=.coverage-release-reader --fail-under=100
          uv run --locked python -m unittest scripts.release_reader_native_qualification
      - name: Disposable TLS SQL reader with controlled signed fixtures, not ML acceptance
        run: uv run --locked python -m scripts.release_reader_native --state .runtime --confirm-disposable
      - name: Persistent serving, HTTP limits and cancellation contracts
        run: |
          uv run --locked coverage run --data-file=.coverage-privacy --source=scripts.serving_privacy_probe -m unittest scripts.serving_privacy_qualification
          uv run --locked coverage report --data-file=.coverage-privacy --fail-under=100
          uv run --locked coverage run --data-file=.coverage-http-audit --source=mlsecops.serving_http_audit -m unittest scripts.serving_http_qualification scripts.serving_http_audit_qualification
          uv run --locked coverage report --data-file=.coverage-http-audit --fail-under=100
          uv run --locked coverage run --data-file=.coverage-serving-context --source=mlsecops.serving_context -m unittest scripts.serving_context_qualification
          uv run --locked coverage report --data-file=.coverage-serving-context --fail-under=100
          uv run --locked coverage run --data-file=.coverage-serving --source=mlsecops.serving_protocol,mlsecops.serving_worker,mlsecops.serving_runtime,mlsecops.serving,mlsecops.serving_http -m unittest scripts.serving_session_qualification scripts.serving_runtime_qualification scripts.serving_core_qualification scripts.serving_http_qualification scripts.serving_native_qualification
          uv run --locked coverage report --data-file=.coverage-serving --fail-under=85
          uv run --locked coverage run --data-file=.coverage-client-access --source=mlsecops.serving_access -m unittest scripts.serving_access_qualification scripts.serving_http_qualification
          uv run --locked coverage report --data-file=.coverage-client-access --fail-under=100
      - name: Disposable actual HTTP and isolated ONNX serving with current SQL trust
        run: uv run --locked python -m scripts.release_reader_native --state .runtime --confirm-disposable --worker-image trusted-mlsecops:dev
      - name: Candidate qualification permission and actual HTTP matrix contracts
        run: |
          uv run --locked coverage run --data-file=.coverage-candidate-serving --source=scripts.candidate_serving_reader -m unittest scripts.candidate_serving_reader_qualification
          uv run --locked coverage report --data-file=.coverage-candidate-serving --fail-under=90
          uv run --locked python -m unittest scripts.candidate_serving_native_qualification
          uv run --locked coverage run --data-file=.coverage-http-outage --source=scripts.serving_outage_native -m unittest scripts.serving_outage_qualification
          uv run --locked coverage report --data-file=.coverage-http-outage --fail-under=90
          uv run --locked coverage run --data-file=.coverage-paused-query --source=scripts.serving_pause_native -m unittest scripts.serving_pause_qualification
          uv run --locked coverage report --data-file=.coverage-paused-query --fail-under=90
      - name: Unchanged actual candidate in isolated HTTP qualification without release approval
        run: uv run --locked python -m scripts.candidate_serving_native --state .runtime --confirm-disposable
