name: M23 security event contracts
on:
  push:
    branches: [main, codex/cp4-m23-security-events-20261107]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-events-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked contracts and exact per-module coverage
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops/security_event*.py scripts/security_event*_qualification.py
          uv run --locked ruff format --check mlsecops/security_event*.py scripts/security_event*_qualification.py
          uv run --locked python scripts/check_docs.py
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/security-events.coverage" --source=mlsecops.security_events,mlsecops.security_event_config -m unittest scripts.security_events_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/security-events.coverage" -o "$RUNNER_TEMP/security-events-coverage.json"
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'security-events-coverage.json').read_text())['files']
          if set(files) != {'mlsecops/security_events.py', 'mlsecops/security_event_config.py'}:
              raise SystemExit('security_event_coverage_inventory')
          for name, report in sorted(files.items()):
              stats = report['summary']
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if stats[total] <= 0 or stats[covered] != stats[total]:
                      raise SystemExit('security_event_coverage_incomplete:' + name)
              print(json.dumps({'source': os.environ['GITHUB_SHA'], 'module': name, 'coverage': stats}, sort_keys=True))
          print('Authenticated contracts only. No durable collector, runtime delivery, promotion outage or full M23/R1 acceptance claimed.')
          PY
      - name: Existing signature and monitoring domain regressions
        run: uv run --locked python -m unittest scripts.key_files_qualification scripts.monitoring_alerts_qualification scripts.release_policy_qualification
      - name: Durable journal, actual filesystem faults and restart
        run: |
          uv run --locked ruff check mlsecops/security_event_ledger.py mlsecops/security_event_store.py mlsecops/security_event_health.py scripts/security_event_ledger_qualification.py scripts/security_event_store_qualification.py scripts/security_event_health_qualification.py
          uv run --locked ruff format --check mlsecops/security_event_ledger.py mlsecops/security_event_store.py mlsecops/security_event_health.py scripts/security_event_ledger_qualification.py scripts/security_event_store_qualification.py scripts/security_event_health_qualification.py
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/security-store.coverage" --source=mlsecops.security_event_ledger,mlsecops.security_event_store,mlsecops.security_event_health -m unittest scripts.security_event_ledger_qualification scripts.security_event_store_qualification scripts.security_event_health_qualification scripts.security_event_routes_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/security-store.coverage" -o "$RUNNER_TEMP/security-store-coverage.json"
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'security-store-coverage.json').read_text())['files']
          if set(files) != {'mlsecops/security_event_ledger.py', 'mlsecops/security_event_store.py', 'mlsecops/security_event_health.py'}:
              raise SystemExit('security_store_coverage_inventory')
          for name, report in sorted(files.items()):
              stats = report['summary']
              print(json.dumps({'source': os.environ['GITHUB_SHA'], 'module': name, 'coverage': stats, 'missing_lines': report['missing_lines'], 'missing_branches': report['missing_branches']}, sort_keys=True))
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if stats[total] <= 0 or stats[covered] / stats[total] < 0.95:
                      raise SystemExit('security_store_coverage_incomplete:' + name)
          print('Durable journal component only. Actual routing, adapters, telemetry deadlines and promotion outage remain open.')
          PY
      - name: Collector lifecycle and bounded HTTP contracts
        run: uv run --locked python -m unittest scripts.security_event_runtime_qualification scripts.security_event_http_qualification
      - name: Audit operator ownership, role resources and explicit fresh volume provisioning
        run: |
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/serving-handoff.coverage" --source=mlsecops.kube_serving_handoff -m unittest scripts.kube_serving_service_qualification scripts.kube_serving_handoff_qualification scripts.kube_serving_handoff_native_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/serving-handoff.coverage" -o "$RUNNER_TEMP/serving-handoff.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'serving-handoff.json').read_text())['files']
          if set(files) != {'mlsecops/kube_serving_handoff.py'}:
              raise SystemExit('serving_handoff_coverage_inventory')
          stats = files['mlsecops/kube_serving_handoff.py']['summary']
          for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
              if not stats[total] or stats[covered] / stats[total] < .95:
                  raise SystemExit('serving_handoff_coverage_incomplete')
          print(json.dumps({'module': 'mlsecops/kube_serving_handoff.py', 'coverage': stats}, sort_keys=True))
          PY
          uv run --locked ruff check mlsecops/kube_serving*.py scripts/kube_serving*.py
          uv run --locked ruff format --check mlsecops/kube_serving*.py scripts/kube_serving*.py
          uv run --locked python -W error -m unittest scripts.kube_observer_profile_qualification scripts.kube_security_rotation_qualification
          uv run --locked python -W error -m unittest scripts.kube_root_rotation_qualification scripts.kube_candidate_root_qualification
          uv run --locked ruff check mlsecops/kube_security*.py scripts/kube_security*.py
          uv run --locked ruff format --check mlsecops/kube_security*.py scripts/kube_security*.py
          uv run --locked python -m unittest scripts.kube_security_native_qualification scripts.kube_promotion_qualification scripts.kube_promotion_native_qualification scripts.trust_targets_qualification scripts.kube_serving_native_qualification scripts.kube_privacy_native_qualification scripts.kube_load_native_qualification scripts.kube_candidate_qualification scripts.kube_cli_privacy_qualification
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/security-provision.coverage" --source=mlsecops.security_event_provision,mlsecops.kube_security_resources,mlsecops.kube_security_materials,mlsecops.kube_security_events -m unittest scripts.security_event_provision_qualification scripts.kube_security_resources_qualification scripts.kube_security_materials_qualification scripts.kube_security_events_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/security-provision.coverage" -o "$RUNNER_TEMP/security-provision-coverage.json"
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'security-provision-coverage.json').read_text())['files']
          if set(files) != {'mlsecops/security_event_provision.py', 'mlsecops/kube_security_resources.py', 'mlsecops/kube_security_materials.py', 'mlsecops/kube_security_events.py'}:
              raise SystemExit('security_provision_coverage_inventory')
          for name, report in sorted(files.items()):
              stats = report['summary']
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if stats[total] <= 0 or stats[covered] / stats[total] < 0.95:
                      raise SystemExit('security_provision_coverage_incomplete:' + name)
              print(json.dumps({'source': os.environ['GITHUB_SHA'], 'module': name, 'coverage': stats}, sort_keys=True))
          print('Operator contracts and real Linux journal provisioning only. Kubernetes deployment is not accepted by these tests.')
          PY
      - name: Observer rotation proof, ownership and bounded readback coverage
        run: |
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/observer-rotation.coverage" --source=mlsecops.kube_observer_profile,mlsecops.kube_observer_readback,mlsecops.kube_security_rotation -m unittest scripts.kube_observer_profile_qualification scripts.kube_security_rotation_qualification scripts.kube_security_events_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/observer-rotation.coverage" -o "$RUNNER_TEMP/observer-rotation.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'observer-rotation.json').read_text())['files']
          expected = {'mlsecops/kube_observer_profile.py', 'mlsecops/kube_observer_readback.py', 'mlsecops/kube_security_rotation.py'}
          if set(files) != expected:
              raise SystemExit('observer_rotation_coverage_inventory')
          for name, report in sorted(files.items()):
              stats = report['summary']
              print(json.dumps({'module': name, **stats}, sort_keys=True))
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if not stats[total] or stats[covered] / stats[total] < .95:
                      raise SystemExit('observer_rotation_coverage:' + name)
          PY
      - name: Actual loopback delivery, elapsed heartbeat deadline, restart and cleanup
        run: uv run --locked python -m unittest scripts.security_event_live_qualification
      - name: Producer outbox, bounded mutual TLS and actual intake sources
        run: |
          uv run --locked ruff check mlsecops/artifact_intake.py mlsecops/controller.py mlsecops/pipeline.py mlsecops/storage_pipeline.py scripts/holdout_budget_qualification.py
          uv run --locked ruff format --check mlsecops/artifact_intake.py mlsecops/controller.py mlsecops/pipeline.py mlsecops/storage_pipeline.py scripts/holdout_budget_qualification.py
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/producer-heartbeat.coverage" --source=mlsecops.security_event_outbox,mlsecops.security_event_delivery,mlsecops.security_event_tls,mlsecops.security_event_server -m unittest scripts.security_producer_heartbeat_qualification scripts.security_event_outbox_qualification scripts.security_event_delivery_qualification scripts.security_event_wire_qualification scripts.security_event_source_qualification scripts.security_event_source_live_qualification scripts.security_event_tls_qualification scripts.security_event_tls_live_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/producer-heartbeat.coverage" -o "$RUNNER_TEMP/producer-heartbeat.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'producer-heartbeat.json').read_text())['files']
          for name, report in sorted(files.items()):
              stats = report['summary']
              print(json.dumps({'module': name, **stats}, sort_keys=True))
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if not stats[total] or stats[covered] / stats[total] < .95:
                      raise SystemExit('producer_heartbeat_coverage:' + name)
          PY
          uv run --locked python -m unittest scripts.artifact_intake_qualification scripts.intake_denial_qualification scripts.evaluation_quality_qualification scripts.holdout_budget_qualification
      - name: Fresh authenticated audit and mandatory promotion boundary
        run: |
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python -m unittest scripts.promotion_qualification scripts.promotion_controller_qualification scripts.rollback_admission_qualification scripts.promotion_entrypoint_qualification scripts.release_reader_native_qualification scripts.release_native_qualification
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/security-admission.coverage" --source=mlsecops.security_event_admission -m unittest scripts.security_event_admission_qualification scripts.security_event_tls_qualification
          uv run --locked coverage report --data-file="$RUNNER_TEMP/security-admission.coverage" --fail-under=95
          uv run --locked coverage json --data-file="$RUNNER_TEMP/security-admission.coverage" -o "$RUNNER_TEMP/security-admission.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          t = json.loads((Path(os.environ['RUNNER_TEMP']) / 'security-admission.json').read_text())['totals']
          if not t['num_branches'] or t['covered_branches'] / t['num_branches'] < .95:
              raise SystemExit('security_admission_branch_coverage')
          print(json.dumps(t, sort_keys=True))
          PY
      - name: Committed trust history, root rotation and replay contracts
        run: |
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/trust-events.coverage" --source=mlsecops.security_trust_events,mlsecops.security_trust_service -m unittest scripts.security_trust_events_qualification scripts.security_trust_service_qualification
          uv run --locked coverage report --data-file="$RUNNER_TEMP/trust-events.coverage" --fail-under=95
          uv run --locked coverage json --data-file="$RUNNER_TEMP/trust-events.coverage" -o "$RUNNER_TEMP/trust-events.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'trust-events.json').read_text())['files']
          for name, report in sorted(files.items()):
              t = report['summary']
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if not t[total] or t[covered] / t[total] < .95:
                      raise SystemExit('trust_security_coverage:' + name)
              print(json.dumps({'module': name, **t}, sort_keys=True))
          PY
      - name: Actual inventory predicates, pinned observer CLI and lineage regressions
        run: |
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/inventory-events.coverage" --source=mlsecops.security_inventory_events,mlsecops.asset_graph,mlsecops.candidate_lineage -m unittest scripts.security_inventory_events_qualification scripts.asset_graph_qualification scripts.candidate_lineage_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/inventory-events.coverage" -o "$RUNNER_TEMP/inventory-events.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'inventory-events.json').read_text())['files']
          for name, report in sorted(files.items()):
              stats = report['summary']
              print(json.dumps({'module': name, **stats}, sort_keys=True))
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if not stats[total] or stats[covered] / stats[total] < .95:
                      raise SystemExit('inventory_security_coverage:' + name)
          PY
          uv run --locked python -W error -m unittest scripts.material_bundle_qualification scripts.release_bundle_qualification
      - name: Identity source, bounded child lifecycle and HTTP privacy regressions
        run: |
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/identity-events.coverage" --source=mlsecops.security_identity_events,mlsecops.security_identity_http -m unittest scripts.security_identity_events_qualification scripts.security_identity_http_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/identity-events.coverage" -o "$RUNNER_TEMP/identity-events.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'identity-events.json').read_text())['files']
          for name, report in sorted(files.items()):
              stats = report['summary']
              print(json.dumps({'module': name, **stats}, sort_keys=True))
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if not stats[total] or stats[covered] / stats[total] < .95:
                      raise SystemExit('identity_security_coverage:' + name)
          PY
          uv run --locked python -m unittest scripts.serving_http_qualification scripts.serving_access_qualification scripts.serving_lifecycle_qualification scripts.serving_http_audit_qualification scripts.serving_metrics_qualification scripts.monitoring_http_qualification scripts.monitoring_dashboard_qualification scripts.serving_privacy_qualification
  audit-promotion-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked native audit admission and real SQL rollback
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked python -W error -m scripts.security_event_promotion_native
      - name: Committed trust SQL history, separate observer CLI and actual collector recovery
        run: uv run --locked python -W error -m scripts.security_trust_events_native
      - name: Continuous trust observer, actual periodic SQL delivery and source loss
        run: uv run --locked python -W error -m scripts.security_trust_service_native
      - name: Actual HTTP identity denial, owned child and collector outage recovery
        run: uv run --locked python -W error -m scripts.security_identity_events_native
