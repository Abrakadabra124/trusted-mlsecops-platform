name: T20 scheduled backup and independent recovery
on:
  push:
    branches: [codex/cp4-m23-security-events-20261107, qualify/t25-delivery]
    paths:
      - '.github/workflows/storage-recovery.yml'
      - 'infra/systemd/mlsecops-daily-backup.*'
      - 'mlsecops/acceptance.py'
      - 'mlsecops/evaluation_gate.py'
      - 'mlsecops/foundation.py'
      - 'mlsecops/inference_gate.py'
      - 'mlsecops/final_evidence.py'
      - 'scripts/promotion_gate_native.py'
      - 'scripts/promotion_entrypoint_native.py'
      - 'scripts/kube_candidate_native.py'
      - 'mlsecops/data_qualification.py'
      - 'mlsecops/reproducibility*.py'
      - 'scripts/reproducibility*.py'
      - 'images/tracking/**'
      - 'mlsecops/integrity_qualification.py'
      - 'mlsecops/storage_pipeline_qualification.py'
      - 'mlsecops/evaluation_qualification.py'
      - 'data.lock'
      - 'mlsecops/daily_backup.py'
      - 'mlsecops/recovery_*.py'
      - 'mlsecops/storage_backup.py'
      - 'mlsecops/storage_restore.py'
      - 'mlsecops/storage_snapshot.py'
      - 'scripts/daily_backup*.py'
      - 'scripts/m17_*.py'
      - 'scripts/recovery_*qualification.py'
      - 'scripts/restore_negative*.py'
      - 'scripts/delivery_candidate*.py'
      - 'mlsecops/poisoning_gate.py'
      - 'mlsecops/robustness_gate.py'
      - 'scripts/canary_rollout_native.py'
      - 'mlsecops/canary_gate.py'
      - 'mlsecops/inventory_fleet.py'
      - 'mlsecops/inventory_gate.py'
      - 'scripts/inventory_*.py'
  workflow_dispatch:
    inputs:
      serving_gate:
        description: Kubernetes campaign to exercise on this attempt's frozen proposal
        type: choice
        default: M12
        options: [M12, M13]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DELIVERY_SERVING_GATE: ${{ inputs.serving_gate || 'M12' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Verify recovery contracts and documentation
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked python scripts/check_docs.py
          export COVERAGE_FILE="$RUNNER_TEMP/m17.coverage"
          modules=mlsecops.daily_backup,mlsecops.recovery_observation,mlsecops.recovery_gate,scripts.daily_backup_systemd_native,scripts.m17_recovery_native,scripts.m17_restore_native,scripts.m17_restored_proposal,scripts.restore_negative_native,scripts.delivery_candidate,mlsecops.evaluation_gate,mlsecops.reproducibility_candidate,mlsecops.inventory_fleet,mlsecops.inventory_gate,scripts.inventory_fleet_native,scripts.inventory_fleet_materials,scripts.inventory_deployment_native
          uv run --locked python -B -W error -m coverage run --branch --source="$modules" -m unittest scripts.daily_backup_qualification scripts.daily_backup_systemd_native_qualification scripts.m17_restore_qualification scripts.m17_restored_proposal_qualification scripts.recovery_observation_qualification scripts.restore_negative_qualification scripts.m17_recovery_native_qualification scripts.recovery_gate_qualification scripts.delivery_candidate_qualification scripts.evaluation_gate_qualification scripts.reproducibility_candidate_qualification scripts.inventory_delivery_qualification scripts.inventory_fleet_qualification scripts.inventory_fleet_evidence_qualification scripts.inventory_materials_qualification scripts.inventory_gate_qualification scripts.asset_graph_qualification scripts.candidate_serving_reader_qualification scripts.canary_candidate_native_qualification scripts.canary_native_evidence_qualification scripts.canary_rollback_native_qualification scripts.canary_rollout_native_qualification scripts.release_native_qualification
          uv run --locked python -m coverage json -o "$RUNNER_TEMP/m17-coverage.json"
          uv run --locked python - "$modules" <<'PY'
          import json, os, sys
          from pathlib import Path
          files = json.loads((Path(os.environ["RUNNER_TEMP"]) / "m17-coverage.json").read_bytes())["files"]
          assert set(files) == {m.replace(".", "/") + ".py" for m in sys.argv[1].split(",")}
          for name, report in sorted(files.items()):
              summary = report["summary"]
              print(name, summary["covered_lines"], summary["num_statements"], summary["covered_branches"], summary["num_branches"])
              if summary["covered_branches"] * 100 < 95 * summary["num_branches"]:
                  raise SystemExit("Recovery branch coverage below policy: " + name)
          PY
      - name: Prepare pinned CPU runtime
        run: |
          uv run --locked python -B -m mlsecops bootstrap
          uv run --locked python -B scripts/install_ci_tools.py
          echo "$GITHUB_WORKSPACE/.runtime/bin" >> "$GITHUB_PATH"
          uv run --locked python -B -m mlsecops build
      - name: Start the owned disposable cluster and its private storage
        id: cluster
        run: |
          kind get clusters > "$RUNNER_TEMP/mlsecops-clusters.txt"
          if grep -Fxq trusted-mlsecops "$RUNNER_TEMP/mlsecops-clusters.txt"; then exit 1; fi
          test ! -e .runtime/kubeconfig && test ! -e .runtime/cluster.json
          echo 'started_empty=true' >> "$GITHUB_OUTPUT"
          uv run --locked python -B -m mlsecops.cluster bootstrap
          uv run --locked python -B -m mlsecops.kube_storage
      - name: Start owned source storage
        id: sql
        run: |
          uv run --locked python -B -m mlsecops.storage_bootstrap
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          from mlsecops.storage_bootstrap import validate
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              print("workspace=" + validate(Path(".runtime"))["workspace_id"], file=out)
          PY
      - name: Verify the actual cluster, worker, pinned tools and clean bootstrap
        run: uv run --locked python -B -W error -m mlsecops.acceptance --gate M01 --output .runtime/evidence/M01.json
      - name: Verify intake, quarantine and locked training source
        run: uv run --locked python -B -W error -m mlsecops.acceptance --gate M02 --output .runtime/evidence/M02.json
      - name: Verify SQL integrity and role isolation, then evaluate the same training run
        env:
          M07_FRESH_WORKSPACE_ID: ${{ steps.sql.outputs.workspace }}
        run: uv run --locked python -B -W error -m mlsecops.acceptance --gate M07 --output .runtime/evidence/M07.json
      - name: Freeze evaluated candidate and original owner
        id: source
        run: |
          uv run --locked python -B -m scripts.release_native --state .runtime
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          from mlsecops.contracts import bounded_read, canonical, digest, read_json
          state = Path(".runtime")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              for label, name in (("proposal", "evidence/release-native.json"), ("demo", "storage-demo.json")):
                  print(label + "=" + digest(bounded_read(state / name)), file=out)
              print("keys=" + digest(canonical(read_json(state / "trusted-keys.json"))), file=out)
              print("keys_file=" + digest(bounded_read(state / "trusted-keys.json")), file=out)
              print("trust=" + digest(bounded_read(state / "storage-trust.json")), file=out)
          PY
      - name: Prepare inventory branches around the fresh original proposal
        id: inventory_inputs
        env:
          M19_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          M19_DEMO_SHA256: ${{ steps.source.outputs.demo }}
          M19_KEYS_SHA256: ${{ steps.source.outputs.keys }}
          M19_TRUST_SHA256: ${{ steps.source.outputs.trust }}
          M19_WORKSPACE_ID: ${{ steps.sql.outputs.workspace }}
        run: uv run --locked python -B -W error -m scripts.inventory_fleet_materials --existing
      - name: Observe four deployments and capture M19 while the original proposal is valid
        id: inventory_capture
        env:
          M19_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          M19_DEMO_SHA256: ${{ steps.source.outputs.demo }}
          M19_KEYS_SHA256: ${{ steps.source.outputs.keys }}
          M19_TRUST_SHA256: ${{ steps.source.outputs.trust }}
          M19_WORKSPACE_ID: ${{ steps.sql.outputs.workspace }}
          M19_FLEET_INPUTS_SHA256: ${{ steps.inventory_inputs.outputs.sha256 }}
        run: uv run --locked python -B -W error -m scripts.inventory_deployment_native
      - name: Verify signed promotion refusal and authorized control before serving
        env:
          M10_STORAGE_DEMO_SHA256: ${{ steps.source.outputs.demo }}
          M10_RELEASE_REPORT_SHA256: ${{ steps.source.outputs.proposal }}
          M10_KEYS_SHA256: ${{ steps.source.outputs.keys_file }}
          M10_TRUST_SHA256: ${{ steps.source.outputs.trust }}
        run: uv run --locked python -B -W error -m mlsecops.acceptance --gate M10 --output .runtime/evidence/M10.json
      - name: Compare the evaluated ONNX with three fresh trainings and three input mutations
        env:
          M06_DEMO_SHA256: ${{ steps.source.outputs.demo }}
        run: |
          uv run --locked python -B -m scripts.tracking_spike build
          uv run --locked python -B -m scripts.tracking_service up
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M06 --output .runtime/evidence/M06.json
      - name: Stop and verify the owned tracking services
        if: always()
        run: |
          if test -f .runtime/tracking-service/resources.json; then
            uv run --locked python -B -m scripts.tracking_service stop
          fi
      - name: Verify poisoning resistance and ONNX robustness of the frozen candidate
        run: |
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M08 --output .runtime/evidence/M08.json
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M09 --output .runtime/evidence/M09.json
      - name: Serve the frozen proposal through the Kubernetes HTTP worker and verify admission refusals
        if: env.DELIVERY_SERVING_GATE == 'M12'
        env:
          M12_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
        run: |
          if ! uv run --locked python -B -W error -m mlsecops.acceptance --gate M12 --output .runtime/evidence/M12.json; then
            uv run --locked python -c 'from pathlib import Path; from mlsecops.contracts import canonical, read_json; print(canonical(read_json(Path(".runtime/evidence/M12.json")).get("diagnostics", {})).decode())'
            exit 1
          fi
      - name: Verify private inference and operator observations on the frozen proposal
        if: env.DELIVERY_SERVING_GATE == 'M13'
        env:
          M13_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          M13_DEMO_SHA256: ${{ steps.source.outputs.demo }}
        run: uv run --locked python -B -W error -m mlsecops.acceptance --gate M13 --output .runtime/evidence/M13.json
      - name: Measure canary traffic on the frozen proposal before taking its storage offline
        id: canary
        env:
          T19_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
        run: uv run --locked python -B -W error -m scripts.canary_rollout_native capture
      - name: Exercise the complete rollback before creating the daily snapshot
        id: rollback
        env:
          T19_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          T19_PRIMARY_SHA256: ${{ steps.canary.outputs.sha256 }}
        run: uv run --locked python -B -W error -m scripts.canary_rollout_native rollback
      - name: Trigger the timer and restore its exact snapshot into fresh storage
        id: recovery
        env:
          M17_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          M17_KEYS_SHA256: ${{ steps.source.outputs.keys }}
          M17_DEMO_SHA256: ${{ steps.source.outputs.demo }}
        run: uv run --locked python -B -W error -m scripts.m17_recovery_native capture
      - name: Stop and verify owned storage
        if: always() && steps.sql.outcome != 'skipped'
        env:
          BOOTSTRAP: ${{ steps.sql.outcome }}
        run: |
          if test "$BOOTSTRAP" = success; then test -f .runtime/storage.json; fi
          uv run --locked python -B -m scripts.m17_recovery_native stop
      - name: Remove the owned cluster and verify its absence
        if: always() && steps.cluster.outputs.started_empty == 'true'
        run: |
          kind get clusters > "$RUNNER_TEMP/mlsecops-clusters.txt"
          if grep -Fxq trusted-mlsecops "$RUNNER_TEMP/mlsecops-clusters.txt"; then
            if test -f .runtime/cluster.json; then
              uv run --locked python -c 'from pathlib import Path; from mlsecops.cluster import validate_cluster; validate_cluster(Path(".runtime"))'
            else
              test "$(docker inspect --format '{{ index .Config.Labels "io.x-k8s.kind.cluster" }}' trusted-mlsecops-control-plane)" = trusted-mlsecops
            fi
            kind delete cluster --name trusted-mlsecops --kubeconfig .runtime/kubeconfig
          fi
          kind get clusters > "$RUNNER_TEMP/mlsecops-clusters.txt"
          if grep -Fxq trusted-mlsecops "$RUNNER_TEMP/mlsecops-clusters.txt"; then exit 1; fi
      - name: Reverify retained private monitoring and feedback observations after teardown
        if: success() && env.DELIVERY_SERVING_GATE == 'M13'
        run: uv run --locked python -B -W error -c 'from pathlib import Path; from mlsecops.privacy_gate import ingress_retained; from mlsecops.contracts import canonical; print(canonical(ingress_retained(Path(".runtime"))).decode())'
      - name: Replay M16 M17 M19 and reconcile the reports of this campaign after verified cleanup
        id: delivery
        env:
          T19_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          T19_PRIMARY_SHA256: ${{ steps.canary.outputs.sha256 }}
          T19_ROLLBACK_SHA256: ${{ steps.rollback.outputs.sha256 }}
          M17_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          M17_KEYS_SHA256: ${{ steps.source.outputs.keys }}
          M17_DEMO_SHA256: ${{ steps.source.outputs.demo }}
          M17_PRIMARY_SHA256: ${{ steps.recovery.outputs.sha256 }}
          M19_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          M19_DEMO_SHA256: ${{ steps.source.outputs.demo }}
          M19_KEYS_SHA256: ${{ steps.source.outputs.keys }}
          M19_TRUST_SHA256: ${{ steps.source.outputs.trust }}
          M19_WORKSPACE_ID: ${{ steps.sql.outputs.workspace }}
          M19_FLEET_INPUTS_SHA256: ${{ steps.inventory_inputs.outputs.sha256 }}
          M19_PRIMARY_SHA256: ${{ steps.inventory_capture.outputs.sha256 }}
        run: |
          uv run --locked python -B -W error -m scripts.m17_recovery_native replay
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M16 --output .runtime/evidence/M16.json
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M17 --output .runtime/evidence/M17.json
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M19 --output .runtime/evidence/M19.json
          set -o pipefail
          uv run --locked python -B -W error -m scripts.delivery_candidate | tee .runtime/evidence/delivery-candidate.json
          echo "receipt=$(sha256sum .runtime/evidence/delivery-candidate.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          uv run --locked python - <<'PY'
          from pathlib import Path
          import os
          from mlsecops.contracts import bounded_read, canonical, decode, digest
          from scripts.delivery_candidate import campaign_gates
          evidence = Path(".runtime/evidence")
          for gate in campaign_gates(os.environ["DELIVERY_SERVING_GATE"]):
              raw = bounded_read(evidence / (gate + ".json"))
              result = decode(raw)
              print(canonical(result | {"report_sha256": digest(raw)}).decode())
          PY
      - name: Identify missing evidence for final M18 acceptance
        env:
          M18_DELIVERY_SHA256: ${{ steps.delivery.outputs.receipt }}
        run: |
          result=0
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M18 --output .runtime/evidence/M18-gap.json || result=$?
          test "$result" -eq 2
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          from mlsecops.contracts import canonical, read_json
          from mlsecops.final_evidence import CHILDREN
          from scripts.delivery_candidate import campaign_gates
          gates = campaign_gates(os.environ["DELIVERY_SERVING_GATE"])
          report = read_json(Path(".runtime/evidence/M18-gap.json"))
          observed = report["diagnostics"]
          if (report["gate"] != "M18" or report["scope"] != "delivery-receipt-gap-map"
                  or report["status"] != "inconclusive" or report["exit_code"] != 2
                  or report["release_ready"] is not False or report["production_authorized"] is not False
                  or report["source_revision"] != os.environ["GITHUB_SHA"]
                  or observed["delivery_source_revision"] != os.environ["GITHUB_SHA"]
                  or report["artifact_hashes"]["delivery_receipt"] != os.environ["M18_DELIVERY_SHA256"]
                  or observed["unavailable"] or sorted(observed["receipt_matched"]) != sorted(gates)
                  or sorted(observed["missing_receipts"]) != sorted(set(CHILDREN) - set(gates))):
              raise SystemExit("M18 delivery evidence mismatch")
          print(canonical({"M18": report["status"], **observed}).decode())
          PY
