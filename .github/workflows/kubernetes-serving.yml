name: Configured serving with persistent isolated Kubernetes worker
on:
  push:
    branches: [codex/cp3-kubernetes-serving, codex/cp3-serving-trust-lifecycle, codex/cp3-m11-trust]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubernetes-serving-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kubernetes-serving:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked dependencies and serving boundary tests
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked python -m unittest scripts.data_source_lock_qualification
          uv run --locked python -W error -m unittest scripts.kube_controlled_trust_campaign_qualification scripts.kube_owned_probe_qualification scripts.kube_candidate_campaign_qualification scripts.kube_readback_retry_qualification
          uv run --locked coverage run --branch --data-file=.coverage-M11 --source=mlsecops.trust_trace,mlsecops.trust_gate,mlsecops.trust_acceptance,scripts.trust_contracts -m unittest scripts.trust_trace_qualification scripts.trust_gate_qualification scripts.trust_acceptance_qualification scripts.inference_gate_qualification
          uv run --locked coverage report --data-file=.coverage-M11 --fail-under=95
          uv run --locked coverage json --data-file=.coverage-M11 -o .coverage-M11.json
          uv run --locked python -c "import json; fs=json.load(open('.coverage-M11.json'))['files']; raise SystemExit(0 if all(f['summary']['num_branches'] and f['summary']['covered_branches']/f['summary']['num_branches'] >= 0.95 for f in fs.values()) else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-release-key --source=mlsecops.release_key_rotation,mlsecops.release_key_store,mlsecops.promotion_recovery -m unittest scripts.release_key_rotation_qualification scripts.release_key_store_qualification scripts.promotion_policy_history_qualification scripts.promotion_recovery_qualification scripts.kube_promotion_snapshot_qualification scripts.release_key_native_qualification scripts.promotion_recovery_native_qualification
          uv run --locked coverage report --data-file=.coverage-release-key --fail-under=100
          uv run --locked coverage json --data-file=.coverage-release-key -o .coverage-release-key.json
          uv run --locked coverage run --branch --data-file=.coverage-live-root --source=scripts.kube_candidate_root,mlsecops.kube_candidate_trust,mlsecops.kube_serving_lifecycle -m unittest scripts.kube_candidate_root_qualification scripts.candidate_serving_reader_qualification scripts.kube_candidate_qualification scripts.kube_candidate_trust_qualification scripts.kube_serving_lifecycle_qualification scripts.kube_serving_faults_qualification scripts.kube_authority_pair_qualification scripts.kube_root_rotation_qualification
          uv run --locked coverage report --data-file=.coverage-live-root --fail-under=95
          uv run --locked coverage json --data-file=.coverage-live-root -o .coverage-live-root.json
          uv run --locked python -c "import json; fs=json.load(open('.coverage-live-root.json'))['files']; raise SystemExit(0 if all(f['summary']['num_branches'] and f['summary']['covered_branches']/f['summary']['num_branches'] >= 0.95 for f in fs.values()) else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-root-rotation --source=mlsecops.trust_rotation,mlsecops.trust_root_store,mlsecops.trust_authority,scripts.kube_root_rotation -m unittest scripts.trust_rotation_qualification scripts.trust_root_store_qualification scripts.trust_authority_qualification scripts.trust_qualification scripts.kube_root_rotation_qualification
          uv run --locked coverage report --data-file=.coverage-root-rotation --fail-under=95
          uv run --locked coverage json --data-file=.coverage-root-rotation -o .coverage-root-rotation.json
          uv run --locked python -c "import json; fs=json.load(open('.coverage-root-rotation.json'))['files']; raise SystemExit(0 if all(f['summary']['num_branches'] and f['summary']['covered_branches']/f['summary']['num_branches'] >= 0.95 for f in fs.values()) else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-rollback --source=mlsecops.release_rollback,mlsecops.release_authorization,mlsecops.promotion,mlsecops.release_reader,scripts.kube_rollback_native -m unittest scripts.rollback_authorization_qualification scripts.rollback_admission_qualification scripts.kube_rollback_qualification scripts.kube_approval_fixture_qualification scripts.promotion_qualification scripts.release_reader_qualification scripts.promotion_controller_qualification scripts.release_authorization_qualification
          uv run --locked coverage report --data-file=.coverage-rollback --fail-under=95
          uv run --locked coverage json --data-file=.coverage-rollback -o .coverage-rollback.json
          uv run --locked python -c "import json; fs=json.load(open('.coverage-rollback.json'))['files']; raise SystemExit(0 if all(f['summary']['num_branches'] and f['summary']['covered_branches']/f['summary']['num_branches'] >= 0.95 for f in fs.values()) else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-artifact-files --source=mlsecops.contracts -m unittest scripts.artifact_files_qualification
          uv run --locked coverage report --data-file=.coverage-artifact-files --fail-under=95
          uv run --locked coverage json --data-file=.coverage-artifact-files -o .coverage-artifact-files.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-artifact-files.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-key-files --source=mlsecops.key_files -m unittest scripts.key_files_qualification scripts.bootstrap_qualification
          uv run --locked coverage report --data-file=.coverage-key-files --fail-under=95
          uv run --locked coverage json --data-file=.coverage-key-files -o .coverage-key-files.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-key-files.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
          uv run --locked python -m scripts.key_files_native
          uv run --locked coverage run --branch --data-file=.coverage-sql-probe --source=scripts.tracking_sql_probe -m unittest scripts.tracking_sql_probe_qualification
          uv run --locked coverage report --data-file=.coverage-sql-probe --fail-under=100
          uv run --locked coverage run --branch --data-file=.coverage-trust-pair --source=mlsecops.trust_targets,mlsecops.kube_trust_isolation,scripts.kube_authority_pair,scripts.kube_candidate_terminals -m unittest scripts.trust_targets_qualification scripts.kube_trust_isolation_qualification scripts.kube_authority_pair_qualification scripts.kube_trust_qualification scripts.trust_authority_qualification
          uv run --locked coverage report --data-file=.coverage-trust-pair --fail-under=95
          uv run --locked coverage json --data-file=.coverage-trust-pair -o .coverage-trust-pair.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-trust-pair.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-candidate-clock --source=mlsecops.kube_candidate_clock,mlsecops.kube_candidate_replay -m unittest scripts.kube_candidate_clock_qualification scripts.kube_candidate_replay_qualification
          uv run --locked coverage report --data-file=.coverage-candidate-clock --fail-under=95
          uv run --locked coverage json --data-file=.coverage-candidate-clock -o .coverage-candidate-clock.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-candidate-clock.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
          uv run --locked python -m unittest scripts.model_contract_qualification scripts.kube_candidate_qualification scripts.candidate_serving_reader_qualification scripts.kube_promotion_qualification scripts.kube_serving_native_qualification scripts.promotion_state_qualification scripts.controller_readback_qualification scripts.serving_core_qualification scripts.serving_runtime_qualification scripts.serving_http_qualification
          uv run --locked coverage run --branch --data-file=.coverage-kube-serving --source=mlsecops.kube_attach,mlsecops.kube_serving_runtime -m unittest scripts.kube_attach_qualification scripts.kube_serving_runtime_qualification
          uv run --locked coverage report --data-file=.coverage-kube-serving --fail-under=95
          uv run --locked coverage json --data-file=.coverage-kube-serving -o .coverage-kube-serving.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-kube-serving.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-kube-lifecycle --source=scripts.kube_candidate_faults,scripts.kube_promotion_snapshot,mlsecops.kube_candidate_trust,mlsecops.kube_serving_lifecycle,scripts.kube_serving_faults,scripts.kube_trust_blackhole -m unittest scripts.kube_promotion_snapshot_qualification scripts.kube_candidate_trust_qualification scripts.kube_serving_lifecycle_qualification scripts.kube_serving_faults_qualification scripts.kube_trust_blackhole_qualification scripts.kube_candidate_faults_qualification
          uv run --locked coverage report --data-file=.coverage-kube-lifecycle --fail-under=95
          uv run --locked coverage json --data-file=.coverage-kube-lifecycle -o .coverage-kube-lifecycle.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-kube-lifecycle.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-kube-expiry --source=mlsecops.kube_serving_expiry,scripts.kube_approval_fixture -m unittest scripts.kube_serving_expiry_qualification scripts.kube_approval_fixture_qualification
          uv run --locked coverage report --data-file=.coverage-kube-expiry --fail-under=95
          uv run --locked coverage json --data-file=.coverage-kube-expiry -o .coverage-kube-expiry.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-kube-expiry.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-runtime-bootstrap --source=mlsecops.runtime_bootstrap -m unittest scripts.runtime_bootstrap_qualification
          uv run --locked coverage report --data-file=.coverage-runtime-bootstrap --fail-under=95
          uv run --locked coverage json --data-file=.coverage-runtime-bootstrap -o .coverage-runtime-bootstrap.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-runtime-bootstrap.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
          uv run --locked coverage run --branch --data-file=.coverage-promotion-replay --source=mlsecops.promotion_controller,mlsecops.kube_promotion,scripts.kube_promotion_replay -m unittest scripts.promotion_controller_qualification scripts.kube_promotion_qualification scripts.kube_promotion_replay_qualification
          uv run --locked coverage report --data-file=.coverage-promotion-replay --fail-under=95
          uv run --locked coverage json --data-file=.coverage-promotion-replay -o .coverage-promotion-replay.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-promotion-replay.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
      - name: Prepare pinned tools and image
        run: |
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python scripts/install_ci_tools.py
          echo "$GITHUB_WORKSPACE/.runtime/bin" >> "$GITHUB_PATH"
          uv run --locked python -m mlsecops build
      - name: Bootstrap owned cluster
        id: bootstrap
        run: uv run --locked python -m mlsecops.cluster bootstrap
      - name: Prepare model storage and actual source candidate
        run: |
          uv run --locked python -m mlsecops.kube_storage
          uv run --locked python -m mlsecops.storage_bootstrap
          uv run --locked python -m mlsecops.storage_pipeline
      - name: Fresh M11 candidate trust, release replay and live signer acceptance
        run: uv run --locked python -m mlsecops.acceptance --gate M11 --state .runtime --output .runtime/evidence/M11.json
      - name: Complete rotated policy history backup and independent recovery
        run: uv run --locked python -m scripts.promotion_recovery_native --state .runtime --confirm-disposable
      - name: Sanitized rotation and recovery outcomes
        if: always()
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import canonical, read_json
          for name in ('release-key-native', 'release-key-serving', 'promotion-recovery', 'M11'):
              path = Path('.runtime/evidence') / (name + '.json')
              report = read_json(path) if path.is_file() else {'status':'inconclusive','release_ready':False}
              print(canonical({'component':name,'report':report}).decode())
          PY
      - name: Sanitized serving outcome
        if: always()
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import canonical, read_json
          path = Path('.runtime/evidence/kubernetes-serving.json')
          report = read_json(path) if path.is_file() else {'status':'inconclusive','release_ready':False}
          print(canonical(report).decode())
          PY
          echo 'M11 mechanism acceptance preserves actual production refusal. Full M12/M18, independent M22 and R1 remain separate requirements.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stop verified owned source SQL
        if: always()
        run: |
          if test -f .runtime/storage.json; then
            uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import Rejected
          from mlsecops.storage_bootstrap import docker, inspect, validate
          state = Path('.runtime')
          marker = validate(state)
          docker(['stop', '--time', '20', marker['container_id']])
          marker = validate(state)
          if inspect('container', marker['container_id'])['State']['Running']:
              raise Rejected('promotion_source_cleanup_incomplete')
          PY
          fi
      - name: Remove verified owned disposable cluster
        if: always() && steps.bootstrap.outcome == 'success'
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.cluster import validate_cluster
          validate_cluster(Path('.runtime'))
          PY
          kind delete cluster --name trusted-mlsecops --kubeconfig .runtime/kubeconfig
          test -z "$(kind get clusters | sed -n '/^trusted-mlsecops$/p')"
