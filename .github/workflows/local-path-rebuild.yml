name: Build and audit the local-path provisioner candidate
on:
  workflow_dispatch:
  push:
    branches: [qualify/r1-localpath-pvc]
permissions:
  contents: read
concurrency:
  group: local-path-rebuild-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Verify the source and scanner contracts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check scripts/image_local_path*.py scripts/local_path_pvc*.py scripts/local_path_candidate_delivery*.py
          uv run --locked ruff format --check scripts/image_local_path*.py scripts/local_path_pvc*.py scripts/local_path_candidate_delivery*.py
          uv run --locked python -B -W error -m unittest scripts.image_local_path_pair_qualification scripts.image_local_path_rebuild_qualification scripts.local_path_pvc_qualification scripts.local_path_candidate_delivery_qualification
      - name: Build the candidate for linux/amd64
        run: |
          docker buildx build --load --provenance=false --platform linux/amd64 --progress plain \
            --metadata-file "$RUNNER_TEMP/local-path.json" --tag "local-path-r1:$GITHUB_SHA" images/candidates/local-path
      - name: Measure the built image and stock image on one database
        id: paired
        run: |
          image_id=$(jq -er '.["containerimage.config.digest"]' "$RUNNER_TEMP/local-path.json")
          test "$(docker image inspect --format '{{.Id}}' "local-path-r1:$GITHUB_SHA")" = "$image_id"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          options=()
          if [[ "$GITHUB_REF" == refs/heads/qualify/r1-localpath-pvc && "$GITHUB_EVENT_NAME" == push && "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            options+=(--retain-archive)
          fi
          uv run --locked python -m scripts.image_local_path_rebuild --image-id "$image_id" "${options[@]}"

      - name: Prepare the isolated cluster and test consumer
        run: |
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python scripts/install_ci_tools.py
          echo "$GITHUB_WORKSPACE/.runtime/bin" >> "$GITHUB_PATH"
          uv run --locked python -m mlsecops build
      - name: Require an unused cluster name
        id: vacant
        run: |
          set -euo pipefail
          clusters=$(kind get clusters)
          if grep -Fxq trusted-mlsecops <<<"$clusters"; then exit 1; fi
          nodes=$(docker ps -aq --filter label=io.x-k8s.kind.cluster=trusted-mlsecops)
          test -z "$nodes"
      - name: Bootstrap the disposable cluster from the checked out configuration
        run: uv run --locked python -m mlsecops.cluster bootstrap
      - name: Provision a test volume, remount, delete and restore the stock controller
        id: live
        run: |
          image_id=$(jq -er '.["containerimage.config.digest"]' "$RUNNER_TEMP/local-path.json")
          set -o pipefail
          uv run --locked python -m scripts.local_path_pvc --image-id "$image_id" | tee "$RUNNER_TEMP/local-path-pvc.json"
          echo "report_sha256=$(sha256sum "$RUNNER_TEMP/local-path-pvc.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Remove the owned cluster and verify the node is absent
        id: cleanup
        if: ${{ always() && steps.vacant.outcome == 'success' }}
        run: |
          set -euo pipefail
          if test -f .runtime/cluster.json; then
            uv run --locked python -m mlsecops.cluster status
          fi
          kind delete cluster --name trusted-mlsecops --kubeconfig .runtime/kubeconfig
          clusters=$(kind get clusters)
          if grep -Fxq trusted-mlsecops <<<"$clusters"; then exit 1; fi
          nodes=$(docker ps -aq --filter label=io.x-k8s.kind.cluster=trusted-mlsecops)
          test -z "$nodes"
          echo disposable_pvc_cluster_absent=pass
      - name: Bind measured bytes to the live result after verified cleanup
        id: delivery
        if: >-
          success() && steps.paired.outputs.measurement_sha256 != '' &&
          steps.live.outcome == 'success' && steps.cleanup.outcome == 'success'
        env:
          MEASUREMENT_SHA256: ${{ steps.paired.outputs.measurement_sha256 }}
          LIVE_REPORT_SHA256: ${{ steps.live.outputs.report_sha256 }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: uv run --locked python -m scripts.local_path_candidate_delivery
      - name: Upload the qualified system image and receipt
        if: success() && steps.delivery.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-path-qualified-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/local-path-qualified/candidate.tar
            ${{ runner.temp }}/local-path-qualified/receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
