name: Candidate-bound M08 poisoning acceptance
on:
  push:
    branches: [main, codex/cp2-poisoning-gate]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poisoning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  poisoning-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked sources and negative poisoning contracts
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops/poisoning_gate.py mlsecops/acceptance.py scripts/poisoning*.py
          uv run --locked ruff format --check mlsecops/poisoning_gate.py mlsecops/acceptance.py scripts/poisoning*.py
          uv run --locked python scripts/check_docs.py
          uv run --locked coverage run --data-file=.coverage-poisoning --source=scripts.poisoning -m unittest scripts.poisoning_qualification scripts.poisoning_native_qualification
          uv run --locked coverage report --data-file=.coverage-poisoning --fail-under=95
          uv run --locked coverage run --data-file=.coverage-poisoning-evidence --source=scripts.poisoning_evidence -m unittest scripts.poisoning_evidence_qualification
          uv run --locked coverage report --data-file=.coverage-poisoning-evidence --fail-under=95
          uv run --locked coverage run --branch --data-file=.coverage-poisoning-gate --source=mlsecops.poisoning_gate,scripts.poisoning_contracts -m unittest scripts.poisoning_gate_qualification
          uv run --locked coverage report --data-file=.coverage-poisoning-gate --fail-under=95
          uv run --locked coverage json --data-file=.coverage-poisoning-gate -o .coverage-poisoning-gate.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-poisoning-gate.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
      - name: Build current offline worker
        run: uv run --locked python -m mlsecops build
      - name: Prepare an actual evaluated candidate in disposable owned storage
        run: |
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python -m mlsecops.storage_bootstrap
          uv run --locked python -m mlsecops.storage_pipeline
      - name: Fresh 30 plus five campaign, reconciliation and candidate replay
        run: uv run --locked python -m mlsecops.acceptance --gate M08 --output .runtime/evidence/M08.json
      - name: Sanitized complete research outcomes including failures
        if: always()
        run: |
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; path=Path('.runtime/evidence/poisoning.json'); report=read_json(path) if path.exists() else {'status':'inconclusive','reason':'missing-evidence'}; print(canonical({key:value for key,value in report.items() if key != 'cases'}).decode()); [print(canonical(case).decode()) for case in report.get('cases',[])]"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; paths=[Path('.runtime/evidence')/name for name in ('M08.json','poisoning-gate.json','poisoning-reconciliation.json')]; [print(canonical(read_json(path)).decode() if path.is_file() else path.name+': no completed report') for path in paths]"
          echo 'Fresh candidate-bound M08, fixed synthetic protocol. Failed thresholds block this gate; M22 and full R1 remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stop only verified owned disposable storage
        if: always()
        run: |
          if test -f .runtime/storage.json; then
            uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import Rejected
          from mlsecops.storage_bootstrap import docker, inspect, validate
          state = Path('.runtime')
          marker = validate(state)
          docker(['stop', '--time', '20', marker['container_id']])
          marker = validate(state)
          if inspect('container', marker['container_id'])['State']['Running']:
              raise Rejected('M08_storage_stop_incomplete')
          PY
          fi
