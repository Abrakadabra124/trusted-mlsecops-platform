name: Isolated Kubernetes node candidate
on:
  push:
    branches: [codex/cp2-node-candidate]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked contracts before infrastructure
        run: |
          uv sync --locked --python 3.12.15
          uv run --locked ruff check scripts/image*.py
          uv run --locked ruff format --check scripts/image*.py
          uv run --locked python -m unittest scripts.image_node_candidate_qualification scripts.image_package_observation_qualification scripts.image_go_control_qualification scripts.image_diagnostic_qualification
          uv run --locked python -m scripts.image_suite_qualification
          uv run --locked python scripts/check_docs.py
      - name: Install pinned tools
        run: |
          uv run --locked python scripts/install_ci_tools.py
          echo "$GITHUB_WORKSPACE/.runtime/bin" >> "$GITHUB_PATH"
      - name: Build separate node from checksum-verified release archive
        id: node-build
        run: uv run --locked python -m scripts.image_node_candidate
      - name: Build current worker and tracking for shared audit controls
        run: |
          uv run --locked python -m mlsecops build
          uv run --locked python -m scripts.tracking_spike build
      - name: Audit baseline and candidate bytes against the same database
        run: uv run --locked python -m scripts.image_audit --compare-node-candidate
      - name: Publish bounded diagnostic evidence
        if: ${{ !cancelled() && steps.node-build.outcome == 'success' }}
        run: |
          uv run --locked python -m scripts.image_audit_publication
          echo 'Node candidate diagnostics only. No cluster adoption, functional acceptance, application-coverage approval or R1 release.' >> "$GITHUB_STEP_SUMMARY"
