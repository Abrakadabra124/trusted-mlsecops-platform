name: Candidate-bound M09 format parity and evasion
on:
  push:
    branches: [main, codex/cp2-candidate-m09]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: robustness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-evasion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked tools and negative contracts
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked coverage run --data-file=.coverage-robustness --source=mlsecops.advisory,scripts.robustness -m unittest scripts.robustness_qualification scripts.robustness_native_qualification
          uv run --locked coverage report --data-file=.coverage-robustness --fail-under=100
          uv run --locked coverage run --branch --data-file=.coverage-m09 --source=mlsecops.robustness_gate,mlsecops.candidate_subject,scripts.robustness_contracts -m unittest scripts.robustness_gate_qualification scripts.poisoning_gate_qualification
          uv run --locked coverage run --branch --append --data-file=.coverage-m09 --source=scripts.robustness_contracts -m scripts.robustness_contracts
          uv run --locked coverage report --data-file=.coverage-m09 --fail-under=95
          uv run --locked coverage json --data-file=.coverage-m09 -o .coverage-m09.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-m09.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
      - name: Build exact current source and owned workspace
        run: |
          uv run --locked python -m mlsecops build
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python -m mlsecops.storage_bootstrap
          uv run --locked python -m mlsecops.storage_pipeline
      - name: Fresh candidate parity evasion and actual abstention
        run: uv run --locked python -m mlsecops.acceptance --gate M09 --output .runtime/evidence/M09.json
      - name: Sanitized result including statistical violations
        if: always()
        run: |
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; path=Path('.runtime/evidence/robustness.json'); print(canonical(read_json(path)).decode() if path.is_file() else 'No completed robustness evidence')"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; paths=[Path('.runtime/evidence')/name for name in ('M09.json','robustness-gate.json')]; [print(canonical(read_json(p)).decode() if p.is_file() else p.name+': no completed report') for p in paths]"
          echo 'Fresh actual-candidate M09. Failed evasion thresholds remain blocking; no independent R1 release approval.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stop only verified owned disposable storage
        if: always()
        run: |
          if test -f .runtime/storage.json; then
            uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import Rejected
          from mlsecops.storage_bootstrap import docker, inspect, validate
          state = Path('.runtime')
          marker = validate(state)
          docker(['stop', '--time', '20', marker['container_id']])
          marker = validate(state)
          if inspect('container', marker['container_id'])['State']['Running']:
              raise Rejected('M09_storage_stop_incomplete')
          PY
          fi
