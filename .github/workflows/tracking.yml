name: MLflow tracking compatibility and private service
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tracking-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tracking-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Source, negative contracts and dependency audit
        run: |
          uv sync --locked --python 3.12.15
          uv run --locked ruff check mlsecops scripts/tracking*.py scripts/reproducibility*.py images/tracking/*.py
          uv run --locked ruff format --check mlsecops scripts/tracking*.py scripts/reproducibility*.py images/tracking/*.py
          uv run --locked python scripts/check_docs.py
          uv run --locked python -m scripts.tracking_spike_qualification
          uv run --locked python -m scripts.tracking_config_qualification
          uv run --locked python -m scripts.tracking_client_qualification
          uv run --locked python -m scripts.tracking_doctor_qualification
          uv run --locked coverage run --source=mlsecops.reproducibility_gate -m scripts.reproducibility_gate_qualification
          uv run --locked coverage report --fail-under=95
          uv run --locked coverage json -o .coverage-m06.json
          uv run --locked python -c "import json; totals=json.load(open('.coverage-m06.json'))['totals']; raise SystemExit(0 if totals['num_branches'] and totals['covered_branches']/totals['num_branches'] >= 0.95 else 1)"
          uv run --locked coverage run --source=scripts.tracking_records -m scripts.tracking_records_qualification
          uv run --locked coverage report --fail-under=95
          uv run --locked coverage json -o .coverage.json
          uv run --locked python -c "import json; totals=json.load(open('.coverage.json'))['totals']; raise SystemExit(0 if totals['num_branches'] and totals['covered_branches']/totals['num_branches'] >= 0.95 else 1)"
          uv run --locked pip-audit -r images/tracking/requirements.lock --disable-pip --require-hashes --strict --progress-spinner off
          uv run --locked coverage run --source=scripts.reproducibility -m scripts.reproducibility_qualification
          uv run --locked coverage report --fail-under=95
          uv run --locked coverage json -o .coverage-reproducibility.json
          uv run --locked python -c "import json; totals=json.load(open('.coverage-reproducibility.json'))['totals']; raise SystemExit(0 if totals['num_branches'] and totals['covered_branches']/totals['num_branches'] >= 0.95 else 1)"
      - name: Build isolated locked images
        run: |
          uv run --locked python -m mlsecops build
          uv run --locked python -m scripts.tracking_spike build
      - name: Three real trainings and offline MLflow authorization
        run: uv run --locked python -m scripts.tracking_spike qualify
      - name: Persistent PostgreSQL, verified TLS and real publication
        run: uv run --locked python -m scripts.tracking_service_qualification
      - name: Read-only tracking diagnostic playbook
        run: uv run --locked python -m scripts.tracking_doctor
      - name: M06 fresh training, native mutations and persisted material reconciliation
        run: uv run --locked python -m mlsecops.acceptance --gate M06 --output .runtime/evidence/M06.json
      - name: Sanitized M06 evidence
        if: ${{ !cancelled() }}
        run: |
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; paths=[Path('.runtime/evidence')/name for name in ('M06.json','reproducibility-qualification.json','reproducibility.json')]; [print(canonical(read_json(path)).decode() if path.exists() else path.name+': no report produced') for path in paths]"
      - name: Stop only owned tracking services
        if: ${{ always() }}
        run: |
          if test -f .runtime/tracking-service/resources.json; then
            uv run --locked python -m scripts.tracking_service stop
          fi
      - name: Scope reminder
        if: ${{ !cancelled() }}
        run: echo 'Local M06 reproducibility acceptance. Tracking recovery, Kubernetes publication, image security and full R1 still require their own acceptance.' >> "$GITHUB_STEP_SUMMARY"
