name: Kubernetes isolation qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked tools and workspace
        run: |
          uv sync --locked --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked python -m unittest scripts.cluster_command_qualification scripts.storage_egress_qualification
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python scripts/install_ci_tools.py
          echo "$GITHUB_WORKSPACE/.runtime/bin" >> "$GITHUB_PATH"
      - name: Build pinned worker
        run: uv run --locked python -m mlsecops build
      - name: Bootstrap isolated lab twice
        id: bootstrap
        run: |
          uv run --locked python -m mlsecops.cluster bootstrap
          uv run --locked python -m mlsecops.cluster bootstrap
      - name: Train and evaluate with Kubernetes Jobs
        run: uv run --locked python -m mlsecops demo --backend kubernetes --versioned-data
      - name: Bootstrap private storage
        run: uv run --locked python -m mlsecops.kube_storage
      - name: Signed storage migration, interruption and artifact verification
        run: |
          uv run --locked python -m mlsecops.storage_bootstrap
          uv run --locked python -m mlsecops.kube_storage_migration_qualification
      - name: Bootstrap scoped controllers
        run: uv run --locked python -m mlsecops.controller_bootstrap
      - name: Foundation contracts and fresh-process M01
        run: |
          uv run --locked coverage run --source=mlsecops.bootstrap,mlsecops.foundation,mlsecops.inventory --data-file=.coverage-foundation -m unittest scripts.bootstrap_qualification scripts.foundation_qualification scripts.artifact_intake_qualification.ArtifactIntakeContracts.test_evidence_must_not_precede_workspace_ownership
          uv run --locked coverage report --data-file=.coverage-foundation --fail-under=95
          uv run --locked python -m mlsecops.acceptance --gate M01 --output .runtime/evidence/M01.json
      - name: CP1 access and training fault isolation
        run: |
          uv run --locked coverage run --source=mlsecops.isolation_gates,scripts.isolation_native --data-file=.coverage-isolation -m unittest scripts.isolation_gates_qualification
          uv run --locked coverage report --data-file=.coverage-isolation --fail-under=95
          uv run --locked python -m mlsecops.acceptance --gate M04 --output .runtime/evidence/M04.json
          uv run --locked python -m mlsecops.acceptance --gate M05 --output .runtime/evidence/M05.json
      - name: Complete fresh M21 with scoped intake and independent SQL readback
        run: uv run --locked python -m mlsecops.acceptance --gate M21 --output .runtime/evidence/M21.json
      - name: Sanitized component evidence
        if: always()
        run: |
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; paths=[Path('.runtime/evidence')/name for name in ('M01.json','foundation-qualification.json','M04.json','access-qualification.json','M05.json','training-isolation.json')]; [print(canonical(read_json(path)).decode() if path.is_file() else path.name+': no completed report') for path in paths]"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/kubernetes-qualification.json'); print(canonical(read_json(report)).decode() if report.exists() else 'Qualification report not produced; bootstrap/build may have failed.')"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/kubernetes-storage-qualification.json'); print(canonical(read_json(report)).decode() if report.exists() else 'Private storage qualification report not produced.')"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; report=Path('.runtime/evidence/kubernetes-migration-qualification.json'); print(canonical(read_json(report)).decode() if report.exists() else 'Migration qualification report not produced.')"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; paths=[Path('.runtime/evidence')/name for name in ('M20.json','authority-qualification.json','M20-outputs.json','M20-access.json','M20-controller.json')]; [print(canonical(read_json(path)).decode() if path.exists() else path.name+': no report produced') for path in paths]"
          uv run --locked python -c "from pathlib import Path; from mlsecops.contracts import canonical,read_json; paths=[Path('.runtime/evidence')/name for name in ('M21.json','intake-gate.json','kube-intake-qualification.json')]; [print(canonical(read_json(path)).decode() if path.is_file() else path.name+': no completed report') for path in paths]"
          echo 'M20 lab acceptance plus storage components. Full R1 acceptance remains inconclusive.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove owned disposable CI cluster
        if: always() && steps.bootstrap.outcome == 'success'
        run: kind delete cluster --name trusted-mlsecops --kubeconfig .runtime/kubeconfig
