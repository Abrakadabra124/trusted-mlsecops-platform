name: Controller original model and evaluation readback
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Install locked verifier and check pin handling
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked python -B -m unittest scripts.controller_intake_qualification
      - name: Prepare pinned CPU runtime
        run: |
          uv run --locked python -B -m mlsecops bootstrap
          uv run --locked python -B scripts/install_ci_tools.py
          echo "$GITHUB_WORKSPACE/.runtime/bin" >> "$GITHUB_PATH"
          uv run --locked python -B -m mlsecops build
      - name: Start the owned disposable cluster and its private storage
        id: cluster
        run: |
          kind get clusters > "$RUNNER_TEMP/mlsecops-clusters.txt"
          if grep -Fxq trusted-mlsecops "$RUNNER_TEMP/mlsecops-clusters.txt"; then exit 1; fi
          test ! -e .runtime/kubeconfig && test ! -e .runtime/cluster.json
          echo 'started_empty=true' >> "$GITHUB_OUTPUT"
          uv run --locked python -B -m mlsecops.cluster bootstrap
          uv run --locked python -B -m mlsecops.kube_storage
          uv run --locked python -B -m mlsecops.controller_bootstrap
      - name: Start owned source storage
        id: sql
        run: |
          uv run --locked python -B -m mlsecops.storage_bootstrap
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          from mlsecops.storage_bootstrap import validate
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              print("workspace=" + validate(Path(".runtime"))["workspace_id"], file=out)
          PY
      - name: Begin controller intake campaign
        id: intake_start
        run: uv run --locked python -B -m scripts.controller_intake begin
      - name: Pin the signed original and independently inspect its bytes
        id: original
        env:
          M21_START_SHA256: ${{ steps.intake_start.outputs.start }}
        run: uv run --locked python -B -m scripts.controller_intake_readonly capture
      - name: Transfer the pinned controller history
        id: transfer
        env:
          M21_START_SHA256: ${{ steps.intake_start.outputs.start }}
          M21_CAPTURE_SHA256: ${{ steps.original.outputs.capture }}
        run: uv run --locked python -B -m scripts.controller_intake_readonly transfer
      - name: Read back the exact signed original as promoter
        env:
          M21_START_SHA256: ${{ steps.intake_start.outputs.start }}
          M21_CAPTURE_SHA256: ${{ steps.original.outputs.capture }}
          M21_TRANSFER_SHA256: ${{ steps.transfer.outputs.transfer }}
        run: |
          uv run --locked python -B -m scripts.controller_intake_readonly readback
          sha256sum .runtime/evidence/M21-original-result.json
          cat .runtime/evidence/M21-original-result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Stop and verify owned storage
        if: always() && steps.sql.outcome != 'skipped'
        env:
          BOOTSTRAP: ${{ steps.sql.outcome }}
        run: |
          if test "$BOOTSTRAP" = success; then test -f .runtime/storage.json; fi
          uv run --locked python -B -m scripts.m17_recovery_native stop
      - name: Remove the owned cluster and verify its absence
        if: always() && steps.cluster.outputs.started_empty == 'true'
        run: |
          kind get clusters > "$RUNNER_TEMP/mlsecops-clusters.txt"
          if grep -Fxq trusted-mlsecops "$RUNNER_TEMP/mlsecops-clusters.txt"; then
            if test -f .runtime/cluster.json; then
              uv run --locked python -c 'from pathlib import Path; from mlsecops.cluster import validate_cluster; validate_cluster(Path(".runtime"))'
            else
              test "$(docker inspect --format '{{ index .Config.Labels "io.x-k8s.kind.cluster" }}' trusted-mlsecops-control-plane)" = trusted-mlsecops
            fi
            kind delete cluster --name trusted-mlsecops --kubeconfig .runtime/kubeconfig
          fi
          kind get clusters > "$RUNNER_TEMP/mlsecops-clusters.txt"
          if grep -Fxq trusted-mlsecops "$RUNNER_TEMP/mlsecops-clusters.txt"; then exit 1; fi
