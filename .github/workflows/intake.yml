name: Intake evidence contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked dependencies and negative reconciliation contracts
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked coverage run --source=mlsecops.intake_gate --data-file=.coverage-intake-gate -m scripts.intake_gate_qualification
          uv run --locked coverage report --data-file=.coverage-intake-gate --fail-under=100
      - name: Complete controlled suite including scoped intake contracts
        run: |
          uv run --locked python -m scripts.intake_contracts
          echo 'Controlled contracts only. Full fresh M21 campaign runs with its required backend in Kubernetes isolation qualification; no missing gate is waived.' >> "$GITHUB_STEP_SUMMARY"
