name: M23 security event acceptance
on:
  push:
    branches: [codex/cp4-m23-security-events-20261107]
    paths: ['mlsecops/acceptance.py', 'mlsecops/security_gate*.py', 'scripts/security_gate*.py', 'scripts/security_event_sequence_native.py', 'scripts/security_identity_events_native.py', 'scripts/security_source_campaign.py', 'scripts/security_trust_service_native.py', 'mlsecops/security_outage*.py', 'mlsecops/security_*evidence.py', 'mlsecops/security_inventory_events.py', 'scripts/security_inventory*.py', 'scripts/security_source_capture.py', 'scripts/kube_security*.py', 'scripts/security_audit_boundary*.py', 'scripts/kube_candidate_native.py', 'scripts/kube_serving_native.py', 'scripts/kube_privacy_bundle.py', '.github/workflows/kubernetes-security-outage.yml', 'Dockerfile', 'pyproject.toml', 'uv.lock']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubernetes-security-outage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security-outage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked boundary and green-window contracts
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked python scripts/check_docs.py
          uv run --locked python -B -W error -m unittest scripts.security_outage_exchange_qualification scripts.security_outage_packet_qualification scripts.security_outage_probe_qualification scripts.kube_security_boundary_qualification scripts.kube_security_outage_operator_qualification scripts.kube_security_outage_native_qualification scripts.security_audit_boundary_probe_qualification scripts.kube_candidate_qualification scripts.kube_monitoring_native_qualification scripts.kube_serving_native_qualification scripts.kube_privacy_bundle_qualification
          uv run --locked python -B -W error -m unittest scripts.security_inventory_evidence_qualification scripts.security_source_evidence_qualification scripts.security_source_capture_qualification
      - name: Require per-module coverage for the M23 acceptance path
        run: |
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/m23.coverage" --source=mlsecops.security_gate,mlsecops.security_gate_sources,mlsecops.security_gate_candidate -m unittest scripts.security_gate_qualification scripts.security_gate_sources_qualification scripts.security_gate_candidate_qualification scripts.security_gate_dispatch_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/m23.coverage" -o "$RUNNER_TEMP/m23-coverage.json"
          uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP'])/'m23-coverage.json').read_bytes())['files']
          expected = {'mlsecops/' + name + '.py' for name in ('security_gate', 'security_gate_sources', 'security_gate_candidate')}
          if set(files) != expected:
              raise SystemExit('M23 method coverage inventory changed')
          for name, file in sorted(files.items()):
              stats = file['summary']
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if stats[total] <= 0 or stats[covered] / stats[total] < .95:
                      raise SystemExit('M23 coverage below threshold: ' + name)
              print(name, stats)
          PY
      - name: Prepare pinned tools and image
        run: |
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python scripts/install_ci_tools.py
          echo "$GITHUB_WORKSPACE/.runtime/bin" >> "$GITHUB_PATH"
          uv run --locked python -m mlsecops build
      - name: Prepare owned source SQL
        id: source_sql
        run: uv run --locked python -m mlsecops.storage_bootstrap
      - name: Train and independently evaluate source candidate
        run: uv run --locked python -m mlsecops.storage_pipeline
      - name: Freeze signed release proposal before collecting gate evidence
        id: proposal
        run: |
          uv run --locked python -B -W error -m scripts.release_native --state .runtime
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          from mlsecops.contracts import bounded_read, digest
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print("sha256=" + digest(bounded_read(Path(".runtime/evidence/release-native.json"))), file=output)
          PY
      - name: Capture signed source and transport evidence
        id: sources
        run: uv run --locked python -B -W error -m mlsecops.security_gate sources
      - name: Bootstrap owned cluster
        id: bootstrap
        run: uv run --locked python -m mlsecops.cluster bootstrap
      - name: Prepare model storage in the owned cluster
        run: uv run --locked python -m mlsecops.kube_storage
      - name: Capture inventory decisions for the trained SQL candidate
        id: inventory
        run: uv run --locked python -B -W error -m mlsecops.security_gate inventory
      - name: Run inference and monitoring during the audit outage
        id: outage
        env:
          M23_PROPOSAL_SHA256: ${{ steps.proposal.outputs.sha256 }}
        run: uv run --locked python -B -W error -m mlsecops.security_gate outage
      - name: Stop verified owned source SQL
        if: always()
        env:
          SQL_BOOTSTRAP: ${{ steps.source_sql.outcome }}
        run: |
          if test "$SQL_BOOTSTRAP" = success; then test -f .runtime/storage.json; fi
          if test -f .runtime/storage.json; then
            uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import Rejected
          from mlsecops.storage_bootstrap import docker, inspect, validate
          state = Path('.runtime')
          marker = validate(state)
          docker(['stop', '--time', '20', marker['container_id']])
          marker = validate(state)
          if inspect('container', marker['container_id'])['State']['Running']:
              raise Rejected('security_outage_source_cleanup_incomplete')
          PY
          fi
      - name: Remove verified owned disposable cluster
        if: always() && steps.bootstrap.outcome == 'success'
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.cluster import validate_cluster
          validate_cluster(Path('.runtime'))
          PY
          kind delete cluster --name trusted-mlsecops --kubeconfig .runtime/kubeconfig
          kind get clusters > "$RUNNER_TEMP/remaining-clusters.txt"
          if grep -Fxq trusted-mlsecops "$RUNNER_TEMP/remaining-clusters.txt"; then exit 1; fi
      - name: Replay all signed source evidence and report M23 after cleanup
        env:
          M23_SOURCES_SHA256: ${{ steps.sources.outputs.sha256 }}
          M23_INVENTORY_SHA256: ${{ steps.inventory.outputs.sha256 }}
          M23_OUTAGE_SHA256: ${{ steps.outage.outputs.sha256 }}
        run: |
          result=0
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M23 --output .runtime/evidence/M23.json || result=$?
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import canonical, read_json
          result = read_json(Path('.runtime/evidence/M23.json'))
          print(canonical(result).decode())
          PY
          exit "$result"
