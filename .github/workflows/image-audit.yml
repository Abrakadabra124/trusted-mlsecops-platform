name: Worker, storage and tracking image audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked environment and negative audit contracts
        run: |
          uv sync --locked --python 3.12.15
          uv run --locked ruff check scripts/image*.py
          uv run --locked ruff format --check scripts/image*.py
          uv run --locked coverage run --branch --data-file=.coverage-image-scope --source=scripts.image_scope -m unittest scripts.image_scope_qualification
          uv run --locked coverage report --data-file=.coverage-image-scope --fail-under=95
          uv run --locked coverage json --data-file=.coverage-image-scope -o .coverage-image-scope.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-image-scope.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
          uv run --locked coverage run --source=scripts.image_archive,scripts.image_audit_contract,scripts.image_audit,scripts.image_candidates,scripts.image_comparison -m scripts.image_suite_qualification
          uv run --locked coverage run --append --source=scripts.image_audit_contract -m unittest scripts.image_package_observation_qualification scripts.image_go_control_qualification scripts.image_diagnostic_qualification
          uv run --locked coverage report --fail-under=95
          uv run --locked coverage json -o .coverage.json
          uv run --locked python -c "import json; totals=json.load(open('.coverage.json'))['totals']; raise SystemExit(0 if totals['num_branches'] and totals['covered_branches']/totals['num_branches'] >= 0.95 else 1)"
          uv run --locked coverage run --data-file=.coverage-image-publication --source=scripts.image_audit_publication -m unittest scripts.image_audit_publication_qualification
          uv run --locked coverage report --data-file=.coverage-image-publication --fail-under=95
      - name: Negative storage candidate contracts
        run: |
          uv run --locked ruff check scripts/storage*.py
          uv run --locked ruff format --check scripts/storage*.py
          uv run --locked python -m scripts.storage_image_qualification
          uv run --locked coverage run --source=scripts.storage_candidate -m scripts.storage_candidate_qualification
      - name: Build pinned Linux worker
        run: uv run --locked python -m mlsecops build
      - name: Build locked tracking image for mandatory audit
        run: uv run --locked python -m scripts.tracking_spike build
      - name: Build separate candidate images
        id: candidate-build
        run: uv run --locked python -m scripts.image_candidates build
      - name: Qualify candidate training and prediction compatibility
        run: uv run --locked python -m scripts.image_candidates qualify-worker
      - name: Signed storage restore into a separate candidate target
        run: |
          uv run --locked coverage run --append --source=scripts.storage_candidate -m scripts.storage_candidate
          uv run --locked coverage report --fail-under=95
          uv run --locked coverage json -o .runtime/evidence/storage-candidate-coverage.json
          uv run --locked python -c "import json; totals=json.load(open('.runtime/evidence/storage-candidate-coverage.json'))['totals']; raise SystemExit(0 if totals['num_branches'] and totals['covered_branches']/totals['num_branches'] >= 0.95 else 1)"
      - name: Audit exact worker, PostgreSQL and MLflow images
        if: ${{ !cancelled() && steps.candidate-build.outcome == 'success' }}
        run: uv run --locked python -m scripts.image_audit --compare-candidates
      - name: Publish sanitized result even on failure
        if: ${{ !cancelled() }}
        run: |
          uv run --locked python -m scripts.image_audit_publication
          echo 'Worker/storage/tracking package audit. Deployed controller/system inventory reconciliation and full R1 acceptance remain required.' >> "$GITHUB_STEP_SUMMARY"
