name: Promotion CLI integration with actual candidate refusal
on:
  push:
    branches: [codex/cp3-promotion-entrypoint]
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification to execute
        type: choice
        required: true
        default: t13-m10
        options:
          - t13-m10
          - reader-http
permissions:
  contents: read
concurrency:
  group: promotion-entrypoint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  promotion-entrypoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked dependencies and negative entrypoint contracts
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked python -m unittest scripts.promotion_entrypoint_qualification scripts.promotion_qualification scripts.release_native_qualification scripts.release_reader_native_qualification
          uv run --locked coverage run --branch --data-file=.coverage-m10 --source=scripts.promotion_gate_native -m unittest scripts.promotion_gate_qualification
          uv run --locked coverage json --data-file=.coverage-m10 -o .coverage-m10.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-m10.json'))['totals']; assert t['covered_lines'] / t['num_statements'] >= .95 and t['covered_branches'] / t['num_branches'] >= .95"
          uv run --locked coverage run --branch --data-file=.coverage-promotion-controller --source=mlsecops.promotion_controller -m unittest scripts.promotion_controller_qualification
          uv run --locked coverage report --data-file=.coverage-promotion-controller --fail-under=95
          uv run --locked coverage json --data-file=.coverage-promotion-controller -o .coverage-promotion-controller.json
          uv run --locked python -c "import json; t=json.load(open('.coverage-promotion-controller.json'))['totals']; raise SystemExit(0 if t['num_branches'] and t['covered_branches']/t['num_branches'] >= 0.95 else 1)"
      - name: Prepare actual candidate in fresh owned SQL
        run: |
          uv run --locked python -m mlsecops build
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python -m mlsecops.storage_bootstrap
          uv run --locked python -m mlsecops.storage_pipeline > /dev/null
      - name: Publish the evaluated proposal and pin the owner inputs
        if: inputs.mode == 't13-m10'
        id: proposal
        run: |
          demo=$(sha256sum .runtime/storage-demo.json | cut -d' ' -f1)
          echo "keys=$(sha256sum .runtime/trusted-keys.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "trust=$(sha256sum .runtime/storage-trust.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          uv run --locked python -m scripts.release_native --state .runtime
          echo "demo=$demo" >> "$GITHUB_OUTPUT"
          echo "report=$(sha256sum .runtime/evidence/release-native.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: T13 pre-promotion acceptance on the pinned actual proposal
        if: inputs.mode == 't13-m10'
        env:
          M10_STORAGE_DEMO_SHA256: ${{ steps.proposal.outputs.demo }}
          M10_KEYS_SHA256: ${{ steps.proposal.outputs.keys }}
          M10_TRUST_SHA256: ${{ steps.proposal.outputs.trust }}
          M10_RELEASE_REPORT_SHA256: ${{ steps.proposal.outputs.report }}
        run: uv run --locked python -m mlsecops.acceptance --gate M10 --state .runtime --output .runtime/evidence/M10.json
      - name: Actual candidate inventory events, observer CLI and collector recovery
        if: inputs.mode != 't13-m10'
        run: uv run --locked python -W error -m scripts.security_inventory_events_native --state .runtime
      - name: Actual candidate refusal and controlled CLI to Reader to HTTP
        if: inputs.mode != 't13-m10'
        run: uv run --locked python -m scripts.promotion_entrypoint_native --state .runtime
      - name: Sanitized outcome with explicit acceptance boundary
        if: always() && inputs.mode != 't13-m10'
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import canonical, read_json
          path = Path('.runtime/evidence/promotion-entrypoint.json')
          report = read_json(path) if path.is_file() else {'status':'inconclusive','release_ready':False}
          print(canonical(report).decode())
          PY
          echo 'CLI integration only: controlled positive fixture, actual candidate denied without assurance. Full M10/M12/M18 remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stop only verified owned source SQL
        if: always()
        env:
          PINNED_PROPOSAL: ${{ steps.proposal.outputs.report }}
        run: |
          if test -n "$PINNED_PROPOSAL"; then test -f .runtime/storage.json; fi
          if test -f .runtime/storage.json; then
            uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import Rejected
          from mlsecops.storage_bootstrap import docker, inspect, validate
          state = Path('.runtime')
          marker = validate(state)
          docker(['stop', '--time', '20', marker['container_id']])
          if validate(state) != marker or inspect('container', marker['container_id'])['State']['Running'] is not False:
              raise Rejected('promotion_source_cleanup_incomplete')
          PY
          fi
      - name: Report verified T13 mechanism outcome after source cleanup
        if: success() && inputs.mode == 't13-m10'
        run: |
          uv run --locked python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from mlsecops.contracts import bounded_read, canonical, decode, digest
          raw = bounded_read(Path(".runtime/evidence/M10.json"))
          report = decode(raw)
          print(f"M10 pre-promotion mechanism {report['status']}, {len(report['cases'])} cases.")
          print("Actual proposal denied without assurance. Actual release authorization inconclusive.")
          print("Authorized selection and exact retry used the separate controlled release.")
          print(canonical({"report_sha256": digest(raw), "report": report}).decode())
          PY
