name: M14 measurement contracts
on:
  push:
    branches: [main, codex/cp4-m14-load-20261106]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: load-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked measurement and golden contracts
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked python -m coverage run --branch --data-file="$RUNNER_TEMP/load.coverage" --source=mlsecops.load_golden,mlsecops.load_measurement,scripts.load_resources -m unittest scripts.load_golden_qualification scripts.load_measurement_qualification scripts.load_resources_qualification
          uv run --locked python -m coverage json --data-file="$RUNNER_TEMP/load.coverage" -o "$RUNNER_TEMP/load-coverage.json"
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'load-coverage.json').read_text())['files']
          if set(files) != {'mlsecops/load_golden.py', 'mlsecops/load_measurement.py', 'scripts/load_resources.py'}:
              raise SystemExit('load_coverage_inventory')
          for name, report in sorted(files.items()):
              summary = report['summary']
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if summary[total] <= 0 or summary[covered] * 100 < 95 * summary[total]:
                      raise SystemExit('load_coverage_below_95:' + name + ':' + total)
              print(json.dumps({'source': os.environ['GITHUB_SHA'], 'module': name, 'coverage': summary}, sort_keys=True))
          print('Controlled measurement contracts only; native M14 and R1 remain unaccepted.')
          PY
