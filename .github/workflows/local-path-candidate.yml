name: Compare pinned local-path provisioner images
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: local-path-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Check the comparison contract
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check scripts/image_local_path_pair*.py
          uv run --locked ruff format --check scripts/image_local_path_pair*.py
          uv run --locked python -B -W error -m unittest scripts.image_local_path_pair_qualification
      - name: Scan both image archives on one vulnerability database
        run: uv run --locked python -m scripts.image_local_path_pair
