name: Kubernetes private output and audit integration
on:
  push:
    branches: [codex/cp3-m13-privacy]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubernetes-privacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kubernetes-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked dependencies and privacy regressions
        run: |
          uv sync --locked --no-build --python 3.12.15
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked python -m unittest scripts.kube_privacy_bundle_qualification
          mkdir -p .runtime/evidence
          uv run --locked python -m coverage run --branch --data-file=.runtime/evidence/.coverage-cli --source=scripts.kube_cli_privacy_probe,scripts.kube_cli_privacy_native,mlsecops.kube_serving_probe -m unittest scripts.kube_cli_privacy_qualification scripts.kube_serving_native_qualification
          uv run --locked python -m coverage json --data-file=.runtime/evidence/.coverage-cli -o .runtime/evidence/cli-coverage.json
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          files = json.loads(Path('.runtime/evidence/cli-coverage.json').read_text())['files']
          required = {'scripts/kube_cli_privacy_probe.py', 'scripts/kube_cli_privacy_native.py', 'mlsecops/kube_serving_probe.py'}
          if set(files) != required:
              raise SystemExit('cli_coverage_modules_mismatch')
          for name in sorted(required):
              stats = files[name]['summary']
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if stats[total] <= 0 or stats[covered] * 100 < 95 * stats[total]:
                      raise SystemExit('cli_coverage_below_95:' + name + ':' + total)
              print(json.dumps({'module': name, 'covered_lines': stats['covered_lines'], 'statements': stats['num_statements'], 'covered_branches': stats['covered_branches'], 'branches': stats['num_branches']}, sort_keys=True))
          PY
          uv run --locked python -m unittest scripts.audit_evidence_parent_qualification scripts.audit_packet_io_qualification scripts.audit_snapshot_qualification scripts.serving_output_native_qualification
          uv run --locked python -m unittest scripts.data_source_lock_qualification scripts.kube_privacy_logs_qualification scripts.kube_privacy_worker_qualification scripts.kube_privacy_exchange_qualification scripts.kube_privacy_operator_qualification scripts.kube_privacy_probe_qualification scripts.kube_privacy_native_qualification scripts.kube_serving_runtime_qualification scripts.kube_candidate_qualification
          uv run --locked python -m unittest scripts.serving_output_qualification scripts.serving_privacy_qualification scripts.serving_metrics_probe_qualification scripts.audit_evidence_qualification scripts.audit_correlation_qualification scripts.audit_export_qualification
      - name: Prepare pinned tools and image
        run: |
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python scripts/install_ci_tools.py
          echo "$GITHUB_WORKSPACE/.runtime/bin" >> "$GITHUB_PATH"
          uv run --locked python -m mlsecops build
      - name: Bootstrap owned cluster
        id: bootstrap
        run: uv run --locked python -m mlsecops.cluster bootstrap
      - name: Prepare model storage and actual source candidate
        run: |
          uv run --locked python -m mlsecops.kube_storage
          uv run --locked python -m mlsecops.storage_bootstrap
          uv run --locked python -m mlsecops.storage_pipeline
      - name: Actual candidate privacy and private operator observation
        run: uv run --locked python -m scripts.kube_privacy_native --state .runtime
      - name: Public finite projection only
        if: always()
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import canonical, read_json
          path = Path('.runtime/evidence/kubernetes-privacy-public.json')
          result = read_json(path) if path.is_file() else {'status':'inconclusive','release_ready':False}
          print(canonical(result).decode())
          PY
      - name: Stop verified owned source SQL
        if: always()
        run: |
          if test -f .runtime/storage.json; then
            uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import Rejected
          from mlsecops.storage_bootstrap import docker, inspect, validate
          state = Path('.runtime')
          marker = validate(state)
          docker(['stop', '--time', '20', marker['container_id']])
          marker = validate(state)
          if inspect('container', marker['container_id'])['State']['Running']:
              raise Rejected('privacy_source_cleanup_incomplete')
          PY
          fi
      - name: Remove verified owned disposable cluster
        if: always() && steps.bootstrap.outcome == 'success'
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.cluster import validate_cluster
          validate_cluster(Path('.runtime'))
          PY
          kind delete cluster --name trusted-mlsecops --kubeconfig .runtime/kubeconfig
          test -z "$(kind get clusters | sed -n '/^trusted-mlsecops$/p')"
