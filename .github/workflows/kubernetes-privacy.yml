name: Kubernetes private output and audit integration
on:
  push:
    branches: [codex/cp3-m13-privacy]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubernetes-privacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kubernetes-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          python-version: "3.12.15"
          enable-cache: false
      - name: Locked dependencies and privacy regressions
        run: |
          uv sync --locked --no-build --python 3.12.15
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
          uv run --locked ruff check mlsecops scripts
          uv run --locked ruff format --check mlsecops scripts
          uv run --locked python scripts/check_docs.py
          uv run --locked python -m unittest scripts.kube_privacy_bundle_qualification
          uv run --locked python -m coverage run --branch --data-file="$RUNNER_TEMP/mlsecops-privacy-gate.coverage" --source=mlsecops.privacy_gate,scripts.privacy_contracts -m unittest scripts.privacy_gate_qualification
          uv run --locked python -m coverage report --data-file="$RUNNER_TEMP/mlsecops-privacy-gate.coverage" --fail-under=100
          uv run --locked python -m coverage run --branch --data-file="$RUNNER_TEMP/mlsecops-services.coverage" --source=scripts.kube_privacy_services,scripts.kube_cli_privacy_exchange -m unittest scripts.kube_privacy_services_qualification scripts.kube_cli_privacy_exchange_qualification
          uv run --locked python -m coverage report --data-file="$RUNNER_TEMP/mlsecops-services.coverage" --fail-under=100
          uv run --locked python -m coverage run --branch --data-file="$RUNNER_TEMP/mlsecops-cli.coverage" --source=scripts.kube_cli_privacy_probe,scripts.kube_cli_privacy_native,mlsecops.kube_serving_probe -m unittest scripts.kube_cli_privacy_qualification scripts.kube_serving_native_qualification
          uv run --locked python -m coverage json --data-file="$RUNNER_TEMP/mlsecops-cli.coverage" -o "$RUNNER_TEMP/mlsecops-cli-coverage.json"
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'mlsecops-cli-coverage.json').read_text())['files']
          required = {'scripts/kube_cli_privacy_probe.py', 'scripts/kube_cli_privacy_native.py', 'mlsecops/kube_serving_probe.py'}
          if set(files) != required:
              raise SystemExit('cli_coverage_modules_mismatch')
          for name in sorted(required):
              stats = files[name]['summary']
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if stats[total] <= 0 or stats[covered] * 100 < 95 * stats[total]:
                      raise SystemExit('cli_coverage_below_95:' + name + ':' + total)
              print(json.dumps({'module': name, 'covered_lines': stats['covered_lines'], 'statements': stats['num_statements'], 'covered_branches': stats['covered_branches'], 'branches': stats['num_branches']}, sort_keys=True))
          PY
          uv run --locked python -m unittest scripts.audit_evidence_parent_qualification scripts.audit_packet_io_qualification scripts.audit_snapshot_qualification scripts.serving_output_native_qualification
          uv run --locked python -m unittest scripts.data_source_lock_qualification scripts.kube_privacy_logs_qualification scripts.kube_privacy_worker_qualification scripts.kube_privacy_exchange_qualification scripts.kube_privacy_operator_qualification scripts.kube_privacy_probe_qualification scripts.kube_privacy_native_qualification scripts.kube_serving_runtime_qualification scripts.kube_candidate_qualification
          uv run --locked python -m unittest scripts.serving_output_qualification scripts.serving_privacy_qualification scripts.serving_metrics_probe_qualification scripts.audit_evidence_qualification scripts.audit_correlation_qualification scripts.audit_export_qualification
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.privacy_gate import contracts
          value = contracts(Path.cwd())
          print('Fresh M13 pure preflight passed:', value['checks'])
          PY
      - name: Monitoring and ordinary feedback privacy contracts
        run: |
          uv run --locked coverage run --branch --data-file="$RUNNER_TEMP/ingress-privacy.coverage" --source=scripts.monitoring_privacy_probe,scripts.feedback_privacy_native,scripts.source_sql_privacy -m unittest scripts.monitoring_privacy_qualification scripts.feedback_privacy_qualification scripts.source_sql_privacy_qualification scripts.feedback_native_qualification
          uv run --locked coverage json --data-file="$RUNNER_TEMP/ingress-privacy.coverage" -o "$RUNNER_TEMP/ingress-privacy-coverage.json"
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          files = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ingress-privacy-coverage.json').read_text())['files']
          if set(files) != {'scripts/monitoring_privacy_probe.py', 'scripts/feedback_privacy_native.py', 'scripts/source_sql_privacy.py'}:
              raise SystemExit('ingress_privacy_coverage_inventory')
          for name, report in sorted(files.items()):
              stats = report['summary']
              for covered, total in (('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')):
                  if stats[total] <= 0 or stats[covered] * 100 < 95 * stats[total]:
                      raise SystemExit('ingress_privacy_coverage_below_95:' + name + ':' + total)
              print(json.dumps({'module': name, 'coverage': stats}, sort_keys=True))
          PY
      - name: Prepare pinned tools and image
        run: |
          uv run --locked python -m mlsecops bootstrap
          uv run --locked python scripts/install_ci_tools.py
          echo "$GITHUB_WORKSPACE/.runtime/bin" >> "$GITHUB_PATH"
          uv run --locked python -m mlsecops build
      - name: Bootstrap owned cluster
        id: bootstrap
        run: uv run --locked python -m mlsecops.cluster bootstrap
      - name: Prepare model storage and qualify intake, integrity and evaluation
        id: source
        run: |
          uv run --locked python -m mlsecops.kube_storage
          uv run --locked python -m mlsecops.storage_bootstrap
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M02 --output .runtime/evidence/M02.json
          export M07_FRESH_WORKSPACE_ID="$(uv run --locked python -c 'from pathlib import Path; from mlsecops.storage_bootstrap import validate; print(validate(Path(".runtime"))["workspace_id"])')"
          uv run --locked python -B -W error -m mlsecops.acceptance --gate M07 --output .runtime/evidence/M07.json
          uv run --locked python -B -m scripts.release_native --state .runtime
          echo "demo=$(sha256sum .runtime/storage-demo.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "proposal=$(sha256sum .runtime/evidence/release-native.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Fresh M13 privacy acceptance and private operator observation
        env:
          M13_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          M13_DEMO_SHA256: ${{ steps.source.outputs.demo }}
        run: uv run --locked python -m mlsecops.acceptance --gate M13 --profile local-cpu --state .runtime --output .runtime/evidence/M13.json
      - name: Public finite projection only
        if: always()
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import canonical, read_json
          path = Path('.runtime/evidence/M13.json')
          result = read_json(path) if path.is_file() else {'status':'inconclusive','release_ready':False}
          print(canonical(result).decode())
          PY
      - name: Stop verified owned source SQL
        if: always()
        run: |
          if test -f .runtime/storage.json; then
            uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.contracts import Rejected
          from mlsecops.storage_bootstrap import docker, inspect, validate
          state = Path('.runtime')
          marker = validate(state)
          docker(['stop', '--time', '20', marker['container_id']])
          marker = validate(state)
          if inspect('container', marker['container_id'])['State']['Running']:
              raise Rejected('privacy_source_cleanup_incomplete')
          PY
          fi
      - name: Remove verified owned disposable cluster
        if: always() && steps.bootstrap.outcome == 'success'
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mlsecops.cluster import validate_cluster
          validate_cluster(Path('.runtime'))
          PY
          kind delete cluster --name trusted-mlsecops --kubeconfig .runtime/kubeconfig
          test -z "$(kind get clusters | sed -n '/^trusted-mlsecops$/p')"
      - name: Reverify monitoring and feedback packets after infrastructure cleanup
        if: success()
        env:
          M13_PROPOSAL_SHA256: ${{ steps.source.outputs.proposal }}
          M13_DEMO_SHA256: ${{ steps.source.outputs.demo }}
        run: |
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          from mlsecops.contracts import bounded_read, canonical, decode, digest
          from mlsecops.privacy_gate import ingress_retained
          state = Path(".runtime")
          print(canonical(ingress_retained(state)).decode())
          reports = {}
          for gate in ("M02", "M03", "M07", "M13"):
              raw = bounded_read(state / "evidence" / (gate + ".json"))
              report = decode(raw)
              if (report["gate"] != gate or report["status"] != "pass" or report["exit_code"] != 0
                      or report["source_revision"] != os.environ["GITHUB_SHA"] or report["source_dirty"] is not False):
                  raise SystemExit("privacy delivery report invalid: " + gate)
              reports[gate] = report
              print(canonical({**report, "report_sha256": digest(raw)}).decode())
          inputs = {g: r["input_digests"] for g, r in reports.items()}
          for key in ("candidate_reference", "evaluation_reference"):
              if len({inputs[g][key] for g in ("M03", "M07", "M13")}) != 1:
                  raise SystemExit("privacy delivery candidate mismatch")
          if (inputs["M02"]["source"] != inputs["M03"]["source"] or inputs["M02"]["source"] != inputs["M07"]["dataset_source"]
                  or len({inputs[g]["data_lock"] for g in ("M02", "M03", "M07")}) != 1
                  or inputs["M13"]["model_sha256"] != inputs["M07"]["model"]
                  or reports["M13"]["artifact_hashes"]["proposal_packet"] != os.environ["M13_PROPOSAL_SHA256"]
                  or reports["M13"]["artifact_hashes"]["frozen_demo"] != os.environ["M13_DEMO_SHA256"]):
              raise SystemExit("privacy delivery source mismatch")
          PY
